// ── Run Drawer ──
async function openRunDrawer(sessionId) {
  runDrawerSessionId = sessionId;
  renderSidebarList();

  const drawer = document.getElementById('run-drawer');
  drawer.classList.add('open');

  document.getElementById('run-drawer-hdr').innerHTML = `<span class="meta-mono" style="font-size:11px">Loading…</span>`;
  document.getElementById('run-drawer-body').innerHTML = '';
  document.getElementById('run-drawer-body').dataset.session = '';
  document.getElementById('run-drawer-ftr').innerHTML = '';

  try {
    const r = await fetch(`/api/sessions/${sessionId}`, { headers: headers() });
    if (!r.ok) throw new Error();
    const s = await r.json();
    renderRunDrawer(s);
  } catch {
    document.getElementById('run-drawer-hdr').innerHTML = `<span style="color:var(--fg-3)">Error loading run.</span>`;
  }
}

function renderRunDrawer(s) {
  const agent = s.agent || 'general';
  const userMsg = s.messages.find(m => m.role === 'user');
  const assistantMsgs = s.messages.filter(m => m.role === 'assistant');
  const lastResponse = assistantMsgs[assistantMsgs.length - 1];
  const errorMsg = s.messages.find(m => m.role === 'error');
  const m = s.metrics;
  const totalDuration = m?.timing?.run_ms || (s.ended_at ? Date.parse(s.ended_at) - Date.parse(s.started_at) : 0);
  lastDrawerSession = s;

  const job = jobForSession(s.id);
  const isRunning = !!job;
  const stopBtn = job
    ? `<span class="run-status" data-session="${s.id}" style="margin-right:8px">${runStatusHTML(s.id)}</span><button onclick="cancelJob('${job.job_id}')" style="padding:3px 10px;background:var(--danger);color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:11px">Stop</button>`
    : '';

  document.getElementById('run-drawer-hdr').innerHTML = `
    ${pillHTML(agent)}
    <span class="meta-mono" style="font-size:11px">${esc(fmtTime(s.started_at))}</span>
    ${m && !isRunning
      ? `<span style="margin-left:auto">${metricsChipHTML(m.status, m.sources, totalDuration, { onclick: 'toggleStats()', open: statsOpen, backfill: m.source === 'backfill' })}</span>`
      : (totalDuration > 0 ? `<span class="meta-mono" style="margin-left:auto;font-size:11px">${fmtDuration(totalDuration)}</span>` : '<span style="margin-left:auto"></span>')}
    ${stopBtn}
    <button class="btn btn-ghost btn-sm" onclick="closeRunDrawer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  `;

  let body = '';
  if (m && !isRunning && statsOpen) {
    const events = m.source === 'backfill' ? [] : runEventsCache.get(s.id);
    if (events === undefined) loadRunEvents(s.id);
    body += `<div class="stats">${renderStatsPanel(s, events)}${events === undefined || events === null ? '<div class="stats-sec meta">Loading run detail…</div>' : ''}</div>`;
  }
  if (userMsg) {
    body += `<div class="drawer-section-label">Prompt</div>
      <p style="margin:0 0 0;font-size:14px;color:var(--fg);line-height:1.5">${esc(userMsg.content)}</p>`;
  }
  if (lastResponse) {
    body += `<div class="drawer-section-label mt">Response</div>
      <div class="md" style="font-size:13px;color:var(--fg-2);line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px">${marked.parse(lastResponse.content)}</div>`;
  }
  if (errorMsg) {
    body += `<div class="drawer-section-label mt" style="color:var(--danger)">Error</div>
      <div style="font-size:13px;color:var(--danger);background:var(--bg-3);border:1px solid var(--line);border-radius:8px;padding:14px;font-family:var(--font-mono)">${esc(errorMsg.content)}</div>`;
  }
  if (s.tool_calls.length > 0) {
    body += `<div class="drawer-section-label mt">Tool Calls</div>`;
    s.tool_calls.forEach(t => {
      let args = t.args;
      try { args = JSON.stringify(JSON.parse(t.args), null, 2); } catch {}
      let result = t.result;
      try { result = JSON.stringify(JSON.parse(t.result), null, 2); } catch {}
      body += `<details class="tool-call">
        <summary>
          <span class="tool-name">${esc(t.tool_name)}</span>
          <span style="color:var(--fg-3);font-size:10px;font-family:var(--font-mono)">${esc(shortArg(t.args))}</span>
          <span class="tool-dur">${t.duration_ms}ms</span>
        </summary>
        <div class="tool-body"><pre><strong>args:</strong>\n${esc(args)}\n\n<strong>result:</strong>\n${esc(truncate(result, 2000))}</pre></div>
      </details>`;
    });
  }
  if (s.logs) {
    body += `<details class="log-section"${isRunning ? ' open' : ''} style="margin-top:20px">
      <summary>Pipeline logs</summary>
      <pre class="log-body" id="rd-log-pre">${esc(s.logs)}</pre>
    </details>`;
  }

  const bodyEl = document.getElementById('run-drawer-body');
  const sameRun = bodyEl.dataset.session === String(s.id);
  const prevScroll = bodyEl.scrollTop;
  const prevPre = document.getElementById('rd-log-pre');
  const logFollow = !prevPre || prevPre.scrollTop + prevPre.clientHeight >= prevPre.scrollHeight - 8;
  const openDetails = sameRun ? [...bodyEl.querySelectorAll('details')].map(d => d.open) : null;
  bodyEl.innerHTML = body;
  bodyEl.dataset.session = String(s.id);
  if (sameRun) {
    bodyEl.querySelectorAll('details').forEach((d, i) => { if (openDetails[i] !== undefined) d.open = openDetails[i]; });
    bodyEl.scrollTop = prevScroll;
  }
  const pre = document.getElementById('rd-log-pre');
  if (pre && isRunning) {
    if (logFollow) pre.scrollTop = pre.scrollHeight;
    else if (prevPre) pre.scrollTop = prevPre.scrollTop;
  }

  const playIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="none"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>`;
  const cronId = s.dispatch_id;
  document.getElementById('run-drawer-ftr').innerHTML = `
    <button class="btn btn-sm" onclick="rerunSession(${s.id})">${playIcon} Re-run</button>
    ${cronId ? '' : `<button class="btn btn-sm" onclick="promoteToAgent(${s.id})">Promote to agent</button>`}
  `;
}

function closeRunDrawer() {
  document.getElementById('run-drawer').classList.remove('open');
  runDrawerSessionId = null;
  renderSidebarList();
}

async function rerunSession(sessionId) {
  try {
    const sr = await fetch(`/api/sessions/${sessionId}`, { headers: headers() });
    if (!sr.ok) return;
    const s = await sr.json();
    const userMsg = s.messages.find(m => m.role === 'user');
    if (!userMsg) return;
    const res = await fetch('/api/jobs', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ agent: s.agent, messages: [{ role: 'user', content: userMsg.content }] })
    });
    if (!res.ok) { setStatus('error'); return; }
    const { session_id } = await res.json();
    await jobStarted(session_id, s.agent);
  } catch { setStatus('failed'); }
}

async function promoteToAgent(sessionId) {
  const sr = await fetch(`/api/sessions/${sessionId}`, { headers: headers() });
  if (!sr.ok) return;
  const s = await sr.json();
  const userMsg = s.messages.find(m => m.role === 'user');
  openAgentSheet({ agent: s.agent, prompt: userMsg?.content || '', label: '', schedule: '0 8 * * *' });
}

async function openRunInMain(sessionId) {
  closeRunDrawer();
  if (isMobile()) {
    setMobileTab('runs');
    return;
  }
  setSidebarMode('runs');
  runDrawerSessionId = sessionId;
  renderSidebarList();
  // scroll selected sidebar item into view
  requestAnimationFrame(() => {
    const el = document.querySelector('#sb-list .sb-item.active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  });
  // render session in main content area
  try {
    const r = await fetch(`/api/sessions/${sessionId}`, { headers: headers() });
    if (!r.ok) return;
    const s = await r.json();
    renderSessionFull(s);
  } catch {}
}

function renderSessionFull(s) {
  const el = document.getElementById('content');
  const isRunning = !!jobForSession(s.id);
  let body = '';
  if (s.content) {
    body += `<div class="md" style="font-size:14px;line-height:1.7;color:var(--fg-2);margin-bottom:24px">${marked.parse(s.content)}</div>`;
  }
  if (s.tool_calls?.length) {
    body += s.tool_calls.map(tc => {
      const args = typeof tc.input === 'object' ? JSON.stringify(tc.input, null, 2) : String(tc.input ?? '');
      const result = typeof tc.result === 'object' ? JSON.stringify(tc.result, null, 2) : String(tc.result ?? '');
      return `<details class="tool-call"><summary>${esc(tc.name)}</summary>
        <div class="tool-body"><pre><strong>args:</strong>\n${esc(args)}\n\n<strong>result:</strong>\n${esc(truncate(result, 2000))}</pre></div>
      </details>`;
    }).join('');
  }
  if (s.logs) {
    body += `<details class="log-section"${isRunning ? ' open' : ''} style="margin-top:20px">
      <summary>Pipeline logs</summary>
      <pre class="log-body">${esc(s.logs)}</pre>
    </details>`;
  }
  el.innerHTML = `<div style="padding:24px 28px 80px;max-width:860px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      ${pillHTML(s.agent)}
      <span style="font-size:13px;color:var(--fg-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.prompt || '')}</span>
      <span class="meta-mono" style="font-size:11px;color:var(--fg-3);flex-shrink:0">${fmtTime(s.started_at)}</span>
    </div>
    ${body || '<div style="color:var(--fg-3);font-size:13px;font-style:italic">No output recorded.</div>'}
  </div>`;
}

// ── Run metrics ──
// Pipeline phases fold into six groups so charts stay within six categorical colors.
const PHASES = [
  { key: 'plan',   label: 'Plan',     names: ['planner'] },
  { key: 'search', label: 'Search',   names: ['searcher', 'link_validator'] },
  { key: 'fetch',  label: 'Fetch',    names: ['fetcher', 'ranker'] },
  { key: 'read',   label: 'Read',     names: ['page_summarizer'] },
  { key: 'check',  label: 'Validate', names: ['validator'] },
  { key: 'write',  label: 'Write',    names: ['synthesizer', 'aggregator'] },
];
PHASES.forEach((p, i) => { p.color = `var(--ph-${i + 1})`; });
function phaseOf(name) { return PHASES.find(p => p.names.includes(name)) || null; }
function phaseGroups(phases) {
  const out = {};
  for (const [name, ms] of Object.entries(phases || {})) {
    const p = phaseOf(name);
    if (p) out[p.key] = (out[p.key] || 0) + (ms || 0);
  }
  return out;
}

const STATUS_SERIES = [
  { key: 'good', label: 'Done', color: 'var(--st-good)' },
  { key: 'warn', label: 'Empty / 0 sources', color: 'var(--st-warn)' },
  { key: 'crit', label: 'Error', color: 'var(--st-crit)' },
  { key: 'none', label: 'Cancelled', color: 'var(--st-none)' },
];
const TONE_RANK = { none: 0, good: 1, warn: 2, crit: 3 };

function runTone(status, sources) {
  if (status === 'error') return 'crit';
  if (status === 'empty' || (status === 'done' && sources === 0)) return 'warn';
  if (status === 'done') return 'good';
  return 'none';
}
function statusText(status, sources) {
  if (status === 'done' && sources === 0) return 'done, 0 sources';
  return status || 'no metrics yet';
}
function fmtCompact(n) {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(Math.round(n));
}
function fmtBytes(b) {
  if (b == null) return '—';
  if (b >= 1 << 30) return (b / (1 << 30)).toFixed(1) + ' GB';
  if (b >= 1 << 20) return (b / (1 << 20)).toFixed(0) + ' MB';
  return fmtCompact(b) + ' B';
}
function fmtMs(ms) { return ms == null ? '—' : (ms <= 0 ? '0ms' : fmtDuration(ms)); }
function pct(x) { return x == null ? '—' : `${Math.round(x * 100)}%`; }
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url || ''; } }
function shortUrl(url) { try { const u = new URL(url); return u.hostname.replace(/^www\./, '') + (u.pathname.length > 1 ? u.pathname : '') + u.search; } catch { return url || ''; } }

function metricsChipHTML(status, sources, runMs, opts = {}) {
  if (!status) return '';
  const tone = runTone(status, sources);
  const parts = [];
  if (sources != null) parts.push(`${sources} source${sources === 1 ? '' : 's'}`);
  else if (status !== 'done') parts.push(status);
  if (runMs > 0) parts.push(fmtDuration(runMs));
  const label = parts.join(' · ') || status;
  const tip = statusText(status, sources) + (opts.backfill ? ' (reconstructed from logs)' : '');
  if (opts.onclick) {
    return `<button class="mchip t-${tone}${opts.open ? ' open' : ''}" onclick="${opts.onclick}" title="${esc(tip)} · click for stats" aria-expanded="${!!opts.open}"><span class="st-ic"></span>${esc(label)} ${opts.open ? '▴' : '▾'}</button>`;
  }
  return `<span class="mchip t-${tone}" title="${esc(tip)}"><span class="st-ic"></span>${esc(label)}</span>`;
}

// One tooltip for every chart mark: elements carry data-tip (first line bold), shown on hover and focus.
(function initVizTip() {
  const tip = () => document.getElementById('viz-tip');
  function show(target, x, y) {
    const t = tip();
    if (!t) return;
    t.replaceChildren();
    target.dataset.tip.split('\n').forEach((line, i) => {
      const el = document.createElement(i === 0 ? 'b' : 'div');
      el.textContent = line;
      t.appendChild(el);
    });
    t.style.display = 'block';
    const r = t.getBoundingClientRect();
    const left = Math.min(Math.max(8, x + 12), window.innerWidth - r.width - 8);
    const top = y + 14 + r.height > window.innerHeight ? y - r.height - 10 : y + 14;
    t.style.left = left + 'px';
    t.style.top = Math.max(8, top) + 'px';
  }
  function hide() { const t = tip(); if (t) t.style.display = 'none'; }
  document.addEventListener('pointermove', e => {
    const target = e.target.closest?.('[data-tip]');
    if (target) show(target, e.clientX, e.clientY); else hide();
  });
  document.addEventListener('focusin', e => {
    const target = e.target.closest?.('[data-tip]');
    if (!target) return hide();
    const r = target.getBoundingClientRect();
    show(target, r.left + r.width / 2, r.bottom);
  });
  document.addEventListener('focusout', hide);
  document.addEventListener('scroll', hide, true);
})();

// ── Stats cache (/api/stats) ──
const statsCache = {}; // days → { at, data }
async function loadStats(days, force) {
  const c = statsCache[days];
  if (c && !force && Date.now() - c.at < 60000) return c.data;
  try {
    const r = await fetch(`/api/stats?days=${days}`, { headers: headers() });
    if (!r.ok) return c?.data || null;
    const data = await r.json();
    statsCache[days] = { at: Date.now(), data };
    return data;
  } catch { return c?.data || null; }
}
function invalidateStats() { for (const k of Object.keys(statsCache)) delete statsCache[k]; }

function localDayKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function lastDays(n) {
  const out = [];
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d);
    x.setDate(d.getDate() - i);
    out.push({ key: localDayKey(x), date: x });
  }
  return out;
}

// ── Run card: stats panel in the run drawer ──
let statsOpen = (() => { try { return localStorage.getItem('dispatch-stats-open') === '1'; } catch { return false; } })();
let lastDrawerSession = null;
const runEventsCache = new Map(); // session id → events (finished runs only)

function toggleStats() {
  statsOpen = !statsOpen;
  try { localStorage.setItem('dispatch-stats-open', statsOpen ? '1' : '0'); } catch {}
  if (lastDrawerSession) renderRunDrawer(lastDrawerSession);
}

async function loadRunEvents(sessionId) {
  if (runEventsCache.has(sessionId)) return;
  runEventsCache.set(sessionId, null); // loading
  try {
    const r = await fetch(`/api/sessions/${sessionId}/events`, { headers: headers() });
    runEventsCache.set(sessionId, r.ok ? await r.json() : []);
  } catch { runEventsCache.set(sessionId, []); }
  if (lastDrawerSession?.id === sessionId && runDrawerSessionId === sessionId) renderRunDrawer(lastDrawerSession);
}

async function togglePayload(sessionId, seq) {
  const row = document.getElementById(`pl-${seq}`);
  if (!row) return;
  if (!row.hidden) { row.hidden = true; return; }
  row.hidden = false;
  const box = row.querySelector('div');
  if (box.dataset.loaded) return;
  box.textContent = 'Loading…';
  try {
    const r = await fetch(`/api/sessions/${sessionId}/payloads/${seq}`, { headers: headers() });
    if (!r.ok) { box.textContent = r.status === 404 ? 'Payload expired (kept 30 days).' : 'Could not load payload.'; return; }
    const p = await r.json();
    let input = p.input;
    try {
      input = JSON.parse(p.input).map(m => `── ${m.role}${m.tool_calls ? ' (tool calls)' : ''} ──\n${m.content || ''}${m.tool_calls ? '\n' + JSON.stringify(m.tool_calls, null, 2) : ''}`).join('\n\n');
    } catch {}
    box.innerHTML = `<div class="stats-h" style="margin:4px 0 0">Input · ${fmtCompact((p.input || '').length)} chars</div><pre class="pl-pre"></pre>
      <div class="stats-h" style="margin:8px 0 0">Output · ${fmtCompact((p.output || '').length)} chars</div><pre class="pl-pre"></pre>`;
    const pres = box.querySelectorAll('pre');
    pres[0].textContent = input;
    pres[1].textContent = p.output || '(empty)';
    box.dataset.loaded = '1';
  } catch { box.textContent = 'Could not load payload.'; }
}

function tileHTML(label, value, sub, tip) {
  return `<div class="tile"${tip ? ` data-tip="${esc(tip)}"` : ''}><div class="tile-l">${esc(label)}</div><div class="tile-v">${esc(value)}</div>${sub ? `<div class="tile-s">${esc(sub)}</div>` : ''}</div>`;
}

function renderStatsPanel(s, events) {
  const m = s.metrics;
  const t = m.timing || {};
  const llm = m.llm || {};
  const run = m.run || {};
  const backfill = m.source === 'backfill';
  const ev = events || [];
  const by = kind => ev.filter(e => e.kind === kind);
  const sec = (title, body, note) => `<div class="stats-sec"><div class="stats-h">${esc(title)}${note ? `<span class="note">${esc(note)}</span>` : ''}</div>${body}</div>`;
  let html = '';

  // Headline tiles
  const b = m.source_breakdown || {};
  const srcSub = m.inbox
    ? `${m.inbox.items} inbox items${m.inbox.backlog ? ` · ${m.inbox.backlog} still queued` : ''}`
    : [b.summarized_pages && `${b.summarized_pages} pages read`, b.fetched_pages && `${b.fetched_pages} fetched`, b.direct_pages && `${b.direct_pages} direct`, b.search_results && `${b.search_results} results`].filter(Boolean).join(' · ');
  const durSub = [t.queue_ms > 1000 && `queued ${fmtMs(t.queue_ms)}`, t.late_ms > 1000 && `late ${fmtMs(t.late_ms)}`, t.notify_ms && `notify ${fmtMs(t.notify_ms)}`].filter(Boolean).join(' · ');
  const out = m.output || {};
  const synth = m.synth || {};
  const err = run.error;
  html += sec('Run', `<div class="tiles">
    ${tileHTML('Status', statusText(m.status, m.sources), err ? `${err.type} in ${err.phase || '?'}` : (run.trigger || ''), err ? `${err.type}\n${err.message}` : '')}
    ${tileHTML('Sources', m.sources == null ? '—' : String(m.sources), srcSub, 'Distinct sources that reached the synthesizer (inbox items count individually)')}
    ${tileHTML('Duration', fmtMs(t.run_ms), durSub)}
    ${tileHTML('Tokens in / out', `${fmtCompact(llm.prompt_tokens)} / ${fmtCompact(llm.output_tokens)}`, llm.calls ? `${llm.calls} calls${llm.reloads ? ` · ${llm.reloads} reloads` : ''}${llm.truncated ? ` · ${llm.truncated} cut off` : ''}` : '')}
    ${tileHTML('Synth input', synth.sent_chars || synth.input_chars ? `${fmtCompact(synth.sent_chars || synth.input_chars)} chars` : '—', synth.prompt_tokens ? `${fmtCompact(synth.prompt_tokens)} tok · ${fmtMs(synth.ms)}${synth.trimmed ? ' · trimmed' : ''}${synth.hard_truncated ? ' · truncated' : ''}` : '')}
    ${tileHTML('Output', out.words != null ? `${out.words} words` : '—', out.cited_sources != null ? `${out.cited_sources} source${out.cited_sources === 1 ? '' : 's'} cited (${pct(out.citation_rate)})` : (out.urls ? `${out.urls.length} links` : ''))}
  </div>`, backfill ? 'reconstructed from logs: no per-call detail' : `${m.events || ev.length} events`);

  // Phase timeline
  const phaseEvs = by('phase').filter(e => e.name !== 'pipeline' && e.duration_ms != null);
  if (phaseEvs.length) {
    const span = Math.max(1, ...phaseEvs.map(e => e.t_ms + e.duration_ms));
    const lanes = [...new Set(phaseEvs.map(e => e.sub || ''))];
    const laneHTML = lanes.map(l => `${lanes.length > 1 ? `<div class="tl-lane-l">${esc(l || 'main')}</div>` : ''}<div class="tl-lane">${
      phaseEvs.filter(e => (e.sub || '') === l).map(e => {
        const p = phaseOf(e.name);
        return `<span class="tl-seg" tabindex="0" style="left:${(e.t_ms / span * 100).toFixed(2)}%;width:${(e.duration_ms / span * 100).toFixed(2)}%;background:${p ? p.color : 'var(--fg-4)'}" data-tip="${esc(`${fmtMs(e.duration_ms)} · ${e.name.replace('_', ' ')}\nstarts at ${fmtMs(e.t_ms)}${e.data.round ? `\nretry round ${e.data.round}` : ''}${e.data.loop ? `\nloop ${e.data.loop}` : ''}`)}"></span>`;
      }).join('')}</div>`).join('');
    const used = PHASES.filter(p => phaseEvs.some(e => p.names.includes(e.name)));
    html += sec('Timeline', laneHTML + `<div class="legend">${used.map(p => `<span><i style="background:${p.color}"></i>${p.label}</span>`).join('')}</div>`, `0 – ${fmtMs(span)}`);
  } else if (t.phases && Object.keys(t.phases).length) {
    html += sec('Phases', `<dl class="kv">${Object.entries(t.phases).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${fmtMs(v)}</dd>`).join('')}</dl>`);
  }

  // LLM calls
  const llmEvs = by('llm');
  if (llmEvs.length) {
    const rows = llmEvs.map(e => {
      const d = e.data;
      const flags = [
        d.reloaded && `<span class="flag bad" title="Model was loaded for this call (${fmtMs(d.load_ms)})">reload</span>`,
        d.truncated && `<span class="flag bad" title="Stopped at the output cap">cut off</span>`,
        d.ctx_near_full && `<span class="flag bad" title="Prompt used ${pct(d.ctx_used)} of num_ctx">ctx full</span>`,
        d.wait_ms > 2000 && `<span class="flag" title="Waited for Ollama (another client)">wait ${fmtMs(d.wait_ms)}</span>`,
        d.thinking_chars && `<span class="flag bad" title="Model produced reasoning text">think ${fmtCompact(d.thinking_chars)}</span>`,
        !e.ok && `<span class="flag bad" title="${esc(e.error || '')}">failed</span>`,
      ].filter(Boolean).join('');
      return `<tr><td>${esc(e.phase || '')}${e.sub ? ` <span class="meta-mono" style="font-size:10px">${esc(e.sub)}</span>` : ''}${flags}</td>
        <td class="r">${fmtMs(e.duration_ms)}</td><td class="r">${fmtCompact(d.prompt_tokens)}</td><td class="r">${fmtCompact(d.output_tokens)}</td>
        <td class="r" title="prefill ${d.prefill_tps ?? '—'} tok/s">${d.gen_tps != null ? (d.gen_tps >= 100 ? Math.round(d.gen_tps) : d.gen_tps) : '—'}</td><td class="r">${d.ctx_used != null ? pct(d.ctx_used) : '—'}</td>
        <td class="r">${e.has_payload ? `<button class="linkbtn" onclick="togglePayload(${s.id},${e.seq})">view</button>` : ''}</td></tr>
        <tr id="pl-${e.seq}" hidden><td colspan="7"><div></div></td></tr>`;
    }).join('');
    const sumIn = llmEvs.reduce((a, e) => a + (e.data.prompt_tokens || 0), 0);
    html += sec('Model calls', `<table class="mt"><thead><tr><th>Phase</th><th class="r">Time</th><th class="r">In tok</th><th class="r">Out tok</th><th class="r">Tok/s</th><th class="r">Ctx</th><th></th></tr></thead><tbody>${rows}</tbody></table>`,
      `${llmEvs.length} calls · ${fmtCompact(sumIn)} tokens in · ${llmEvs[0].data.model || ''}`);
  }

  // Search
  const sm = m.search;
  if (sm && sm.providers) {
    const prov = Object.entries(sm.providers).filter(([, p]) => p.calls || p.off || p.cooldown);
    const provRows = prov.map(([name, p]) => `<tr><td>${esc(name)}</td><td class="r">${p.ok ?? '—'}</td><td class="r${p.errors ? ' err' : ''}">${p.errors ?? '—'}</td>
      <td class="r">${p.off ? 'off' : p.cooldown ? `${p.cooldown} cooldown` : ''}</td><td class="r">${p.hits ?? '—'}</td><td class="r">${p.unique ?? '—'}</td>
      <td class="r">${p.calls && p.ms != null ? fmtMs(Math.round(p.ms / p.calls)) : '—'}</td></tr>`).join('');
    const searchEvs = by('search');
    const qRows = searchEvs.map(e => {
      const d = e.data;
      const per = Object.entries(d.providers || {}).filter(([, p]) => p.status === 'ok' || p.status === 'error')
        .map(([n, p]) => p.status === 'ok' ? `${n} ${p.count} · ${fmtMs(p.ms)}` : `${n} error`).join('\n');
      return `<tr data-tip="${esc(`${e.name}\n${per}${d.dupes ? `\n${d.dupes} duplicates merged` : ''}${d.ddg_fallback ? '\nDuckDuckGo fallback' : ''}`)}"><td class="url" style="max-width:240px;font-family:var(--font-sans);font-size:11.5px">${d.round ? `<span class="flag">retry ${d.round}</span> ` : ''}${esc(e.name)}</td>
        <td class="r${e.ok ? '' : ' err'}">${e.ok ? (d.hits || []).length : 'failed'}</td><td class="r">${fmtMs(d.ms ?? e.duration_ms)}</td></tr>`;
    }).join('');
    html += sec('Search', `<table class="mt"><thead><tr><th>Provider</th><th class="r">OK</th><th class="r">Err</th><th class="r"></th><th class="r">Hits</th><th class="r">Only here</th><th class="r">Avg</th></tr></thead><tbody>${provRows}</tbody></table>
      ${qRows ? `<details style="margin-top:8px"><summary class="meta-mono" style="cursor:pointer;font-size:10.5px">${searchEvs.length} queries</summary><table class="mt" style="margin-top:4px"><thead><tr><th>Query</th><th class="r">Hits</th><th class="r">Time</th></tr></thead><tbody>${qRows}</tbody></table></details>` : ''}`,
      `${sm.queries ?? 0} queries${sm.retry_queries ? ` (${sm.retry_queries} retries)` : ''} · ${sm.unique_urls ?? '—'} unique URLs${sm.dupes ? ` · ${sm.dupes} dupes` : ''}`);
  }

  // Fetches
  const fetchEvs = by('fetch');
  if (fetchEvs.length) {
    const rows = fetchEvs.map(e => {
      const d = e.data;
      const via = d.via === 'jina_fallback' ? `jina (http gave ${fmtCompact(d.http_chars)})` : (d.via || '');
      const extra = d.inbox ? `${d.inbox.items} items${d.inbox.backlog ? `, ${d.inbox.backlog} queued` : ''}` : '';
      return `<tr data-tip="${esc(`${e.name}\n${[d.status && `HTTP ${d.status}`, d.ctype, d.bytes != null && fmtBytes(d.bytes), via && `via ${via}`, d.final_url && `→ ${d.final_url}`, d.truncated && `kept ${fmtCompact(d.kept_chars)} of ${fmtCompact(d.chars)} chars`, e.error].filter(Boolean).join('\n')}`)}">
        <td class="url">${esc(shortUrl(e.name))}</td><td>${esc(d.source || '')}</td>
        <td class="r${e.ok ? '' : ' err'}">${e.ok ? (d.status || 'ok') : esc(truncate(String(d.status || e.error || 'failed'), 18))}</td>
        <td class="r">${fmtCompact(d.chars)}${d.truncated ? ' ✂' : ''}</td><td class="r">${fmtMs(d.ms ?? e.duration_ms)}</td><td>${esc(extra)}</td></tr>`;
    }).join('');
    const f = m.fetch || {};
    html += sec('Fetches', `<table class="mt"><thead><tr><th>URL</th><th>Source</th><th class="r">Status</th><th class="r">Chars</th><th class="r">Time</th><th></th></tr></thead><tbody>${rows}</tbody></table>`,
      `${f.ok ?? 0} ok · ${f.failed ?? 0} failed${f.jina ? ` · ${f.jina} via Jina` : ''}${f.truncated ? ` · ${f.truncated} cut to cap` : ''}`);
  } else if (m.fetch) {
    html += sec('Fetches', `<dl class="kv"><dt>pages</dt><dd>${m.fetch.pages}</dd><dt>failed</dt><dd>${m.fetch.failed}</dd><dt>chars</dt><dd>${fmtCompact(m.fetch.chars)}</dd></dl>`);
  }
  const lc = by('link_check');
  if (lc.length) {
    const dead = lc.flatMap(e => (e.data.urls || []).filter(u => !u.ok));
    html += sec('Link check', dead.length ? `<table class="mt"><tbody>${dead.map(u => `<tr><td class="url">${esc(shortUrl(u.url))}</td><td class="r err">${esc(String(u.status || u.error || 'dead'))}</td></tr>`).join('')}</tbody></table>` : '<div class="meta">All links live.</div>',
      `${m.links?.checked ?? 0} checked · ${m.links?.dead ?? 0} dead`);
  }

  // Decisions
  const dec = by('decision');
  if (dec.length) {
    const parts = dec.map(e => {
      const d = e.data;
      const sub = e.sub ? ` · ${e.sub}` : '';
      const bad = d.parsed_ok === false ? ` <span class="flag bad" title="Model output was not valid JSON; fallback used">unparsed</span>` : '';
      if (e.name === 'planner') return d.direct_sources ? '' : `<div style="margin-bottom:6px"><span class="meta-mono">planner${sub}</span>${bad}<ul style="margin:3px 0 0 16px;font-size:11.5px;color:var(--fg-2)">${(d.queries || []).map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>`;
      if (e.name === 'validator') return `<div style="margin-bottom:6px;font-size:11.5px"><span class="meta-mono">validator loop ${d.loop}${sub}</span>${bad} · ${d.sufficient ? 'sufficient' : 'not sufficient'}${d.notes ? ` — <span style="color:var(--fg-2)">${esc(d.notes)}</span>` : ''}${(d.retry_queries || []).length ? `<div class="meta">retry: ${esc(d.retry_queries.join(' · '))}</div>` : ''}</div>`;
      if (e.name === 'ranker') return `<div style="margin-bottom:6px;font-size:11.5px"><span class="meta-mono">ranker${sub}</span>${bad} · picked ${(d.selected || []).length} of ${d.candidates}</div>`;
      if (e.name === 'page_summarizer') return `<div style="font-size:11.5px"><span class="meta-mono">read</span> ${esc(shortUrl(d.url))} · ${d.relevant ? `${d.facts} facts` : 'not relevant'}${bad}</div>`;
      return '';
    }).join('');
    if (parts.trim()) html += sec('Decisions', parts);
  }

  // Sources + output
  const doms = m.source_domains || [];
  if (doms.length) {
    const max = Math.max(...doms.map(d => d[1]));
    html += sec('Source domains', `<div class="bars-h">${doms.slice(0, 10).map(([d, n]) => `<div class="bar-row"><span class="l">${esc(d)}</span><span class="t"><span class="f" style="display:block;width:${(n / max * 100).toFixed(1)}%"></span></span><span class="v">${n}</span></div>`).join('')}</div>`);
  }
  if (out.sections) {
    html += sec('Output sections', `<div class="sec-tags">${Object.entries(out.sections).map(([k, ok]) => `<span class="sec-tag${ok ? '' : ' miss'}">${esc(k)}</span>`).join('')}</div>`,
      out.missing_sections?.length ? `${out.missing_sections.length} missing` : 'all present');
  }

  // Host
  const h = m.host;
  if (h) {
    const hostEv = by('host')[0];
    let chart = '';
    if (hostEv && (hostEv.data.t || []).length > 1) {
      const d = hostEv.data;
      const W = 400, H = 60, maxT = Math.max(...d.t);
      const line = (arr) => arr.map((v, i) => v == null ? null : `${(d.t[i] / maxT * W).toFixed(1)},${(H - v / 100 * H).toFixed(1)}`).filter(Boolean).join(' ');
      chart = `<div class="chart" style="margin-top:8px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:60px">
        <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--axis)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <line x1="0" y1="0" x2="${W}" y2="0" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        ${d.gpu ? `<polyline points="${line(d.gpu)}" fill="none" stroke="var(--ph-1)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
        ${d.cpu ? `<polyline points="${line(d.cpu)}" fill="none" stroke="var(--ph-2)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      </svg><div class="legend"><span><i style="background:var(--ph-1)"></i>GPU busy %</span><span><i style="background:var(--ph-2)"></i>CPU %</span><span style="margin-left:auto" class="meta-mono">0–100% · every ${hostEv.data.interval_s}s</span></div></div>`;
    }
    html += sec('Machine', `<div class="tiles">
      ${tileHTML('GPU busy', h.gpu_avg != null ? `${h.gpu_avg}% avg` : '—', h.gpu_max != null ? `max ${h.gpu_max}%` : '')}
      ${tileHTML('CPU', h.cpu_avg != null ? `${h.cpu_avg}% avg` : '—', h.cpu_max != null ? `max ${h.cpu_max}%` : '')}
      ${tileHTML('Temps max', h.gpu_c_max != null ? `${Math.round(h.gpu_c_max)}°C GPU` : '—', [h.cpu_c_max != null && `CPU ${Math.round(h.cpu_c_max)}°C`, h.nvme_c_max != null && `NVMe ${Math.round(h.nvme_c_max)}°C`].filter(Boolean).join(' · '))}
      ${tileHTML('Memory', h.mem_avail_min != null ? `${fmtBytes(h.mem_avail_min)} free` : '—', h.gtt_max != null ? `GTT max ${fmtBytes(h.gtt_max)}` : '')}
    </div>${chart}`, `${h.samples} samples`);
  }

  // Config / build / notify
  const cfg = by('config')[0];
  const kv = [];
  if (m.model) kv.push(['model', m.model]);
  if (m.build?.commit) kv.push(['code', m.build.commit + (m.build.dirty ? ' (uncommitted changes)' : '')]);
  if (run.trigger) kv.push(['trigger', run.trigger]);
  if (run.scheduled_for) kv.push(['scheduled', fmtTime(run.scheduled_for)]);
  if (m.notify) kv.push(['notification', m.notify.sent ? `sent (HTTP ${m.notify.status}, ${fmtMs(m.notify.ms)})` : 'not sent']);
  if (cfg) {
    const env = cfg.data.env || {};
    for (const k of ['CONTEXT_BUDGET', 'NUM_CTX', 'SYNTHESIZER_MAX_TOKENS', 'TEMPERATURE', 'TIMEOUT']) if (env[k]) kv.push([k.toLowerCase(), env[k]]);
    if (env.search_providers) kv.push(['search providers', env.search_providers.join(', ')]);
  }
  if (kv.length) {
    html += sec('Setup', `<dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(String(v))}</dd>`).join('')}</dl>
      ${cfg ? `<details style="margin-top:6px"><summary class="meta-mono" style="cursor:pointer;font-size:10.5px">agent config + prompt versions</summary><pre class="pl-pre">${esc(JSON.stringify({ agent: cfg.data.agent, prompts: cfg.data.prompts, output_template_sha: cfg.data.output_template_sha, env: cfg.data.env }, null, 2))}</pre></details>` : ''}`);
  }

  // Raw events
  if (ev.length) {
    html += sec('All events', ev.map(e => `<details class="ev"><summary><span class="k">${String(e.t_ms).padStart(6)}ms ${esc(e.kind)}</span><span class="n">${esc(e.phase || '')} ${esc(e.name || '')}</span><span class="${e.ok ? '' : 'err'}">${e.duration_ms != null ? fmtMs(e.duration_ms) : ''}${e.ok ? '' : ' ✕'}</span></summary><pre class="pl-pre">${esc(JSON.stringify({ ...e, has_payload: undefined }, null, 2))}</pre></details>`).join(''), `${ev.length}`);
  }
  return html;
}

// ── SVG chart helpers ──
// Axis ticks on clean values: counts in whole steps, durations in whole time units.
const DUR_STEPS = [100, 250, 500, 1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5, 9e5, 18e5, 36e5];
function axisTicks(maxVal, kind) {
  const target = Math.max(maxVal, kind === 'count' ? 1 : 0) / 3 || 1;
  let step;
  if (kind === 'ms') step = DUR_STEPS.find(v => v >= target) || DUR_STEPS[DUR_STEPS.length - 1];
  else {
    const p = Math.pow(10, Math.floor(Math.log10(target)));
    step = [1, 2, 2.5, 5, 10].map(m => m * p).find(v => v >= target);
    if (kind === 'count') step = Math.max(1, Math.ceil(step));
  }
  const max = step * Math.max(1, Math.ceil(maxVal / step));
  const ticks = [];
  for (let v = 0; v <= max + step / 2; v += step) ticks.push(v);
  return { max, ticks };
}
// Rect with 4px rounded top corners, square at the baseline.
function topRoundedPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
// cols: [{ label, values: {seriesKey: n}, tip, onclick }]; series: [{ key, label, color }]; fmtY: tick formatter
function stackedColumnsSVG(width, height, cols, series, fmtY, kind) {
  const L = 44, R = 6, T = 8, B = 20;
  const pw = width - L - R, ph = height - T - B;
  const totals = cols.map(c => series.reduce((a, s) => a + (c.values[s.key] || 0), 0));
  const { max, ticks } = axisTicks(Math.max(0, ...totals), kind);
  const band = pw / Math.max(1, cols.length);
  const bw = Math.max(2, Math.min(24, band * 0.7));
  const y = v => T + ph - v / max * ph;
  let g = '';
  ticks.forEach((v, i) => {
    const yy = y(v);
    g += `<line x1="${L}" x2="${width - R}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${yy + 3}" text-anchor="end">${esc(fmtY(v))}</text>`;
  });
  const every = Math.ceil(cols.length / Math.max(1, Math.floor(pw / 46)));
  cols.forEach((c, i) => {
    const x = L + band * i + (band - bw) / 2;
    let acc = 0;
    const segs = series.filter(s => c.values[s.key] > 0);
    let marks = '';
    segs.forEach((s, j) => {
      const v = c.values[s.key];
      const y0 = y(acc), y1 = y(acc + v);
      const top = j === segs.length - 1;
      const h = Math.max(1, y0 - y1 - (j > 0 ? 2 : 0)); // 2px surface gap between stacked segments
      marks += top ? `<path class="mk" d="${topRoundedPath(x, y1, bw, h, 4)}" fill="${s.color}"/>` : `<rect class="mk" x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${s.color}"/>`;
      acc += v;
    });
    g += `<g class="hit" tabindex="0" data-tip="${esc(c.tip)}"${c.onclick ? ` onclick="${c.onclick}" role="button"` : ''}><rect x="${L + band * i}" y="${T}" width="${band}" height="${ph}" fill="transparent"/>${marks}</g>`;
    if (i % every === 0) g += `<text x="${x + bw / 2}" y="${height - 5}" text-anchor="middle">${esc(c.label)}</text>`;
  });
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">${g}</svg>`;
}
function scatterSVG(width, height, pts, fmtX, fmtY) {
  const L = 44, R = 10, T = 10, B = 22;
  const pw = width - L - R, ph = height - T - B;
  const ax = axisTicks(Math.max(0, ...pts.map(p => p.x)), 'num'), ay = axisTicks(Math.max(0, ...pts.map(p => p.y)), 'ms');
  const mx = ax.max, my = ay.max;
  const X = v => L + v / mx * pw, Y = v => T + ph - v / my * ph;
  let g = '';
  ay.ticks.forEach((v, i) => {
    g += `<line x1="${L}" x2="${width - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${i === 0 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${esc(fmtY(v))}</text>`;
  });
  ax.ticks.forEach((v, i) => {
    g += `<text x="${X(v)}" y="${height - 6}" text-anchor="${i === 0 ? 'start' : i === ax.ticks.length - 1 ? 'end' : 'middle'}">${esc(fmtX(v))}</text>`;
  });
  pts.forEach(p => {
    g += `<g class="hit" tabindex="0" data-tip="${esc(p.tip)}"${p.onclick ? ` onclick="${p.onclick}" role="button"` : ''}><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="10" fill="transparent"/><circle class="mk" cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.color || 'var(--ph-1)'}" stroke="var(--panel)" stroke-width="2"/></g>`;
  });
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">${g}</svg>`;
}

// ── Dashboard tab ──
let dashDays = 7;
let dashResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(dashResizeTimer);
  dashResizeTimer = setTimeout(() => { if (document.querySelector('.dash')) drawDashCharts(); }, 150);
});
function setDashDays(n) { dashDays = n; renderDashboard(); }
function runName(r) {
  const d = r.dispatch_id && allDispatches.find(x => x.id === r.dispatch_id);
  return d ? dispatchLabel(d, 32) : (allAgents.find(a => a.name === r.agent)?.label || r.agent || 'run');
}

let dashData = null;
async function renderDashboard() {
  const el = document.getElementById('content');
  if (!statsCache[dashDays]) el.innerHTML = `<div class="empty-state">Loading…</div>`;
  const st = await loadStats(dashDays);
  if (!(isMobile() ? mobileTab === 'stats' : dispatchTab === 'dashboard')) return;
  if (!st) { el.innerHTML = `<div class="empty-state">Could not load stats.</div>`; return; }
  dashData = st;
  const runs = st.runs.filter(r => r.status);
  const k = st.kpi;
  const active = allDispatches.filter(c => c.enabled);
  const soonest = active.map(c => ({ c, t: nextRun(c.schedule, null, c.timezone) })).filter(x => x.t).sort((a, b) => a.t - b.t)[0];
  const needLook = runs.filter(r => runTone(r.status, r.sources) !== 'good').length;
  const range = `<div class="dash-bar">
    <div style="display:inline-grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px;gap:2px">
      <button class="seg-btn${dashDays === 7 ? ' active' : ''}" onclick="setDashDays(7)">7 days</button>
      <button class="seg-btn${dashDays === 30 ? ' active' : ''}" onclick="setDashDays(30)">30 days</button>
    </div>
    <span class="meta">${runs.length} runs${runs.some(r => r.metrics_source === 'backfill') ? ' · older runs reconstructed from logs' : ''}</span>
  </div>`;
  const kpis = `<div class="kpis">
    <div class="card"><div class="tile-l">Runs</div><div class="kpi-v">${k.runs}</div><div class="kpi-s">last ${dashDays} days</div></div>
    <div class="card"><div class="tile-l">Success</div><div class="kpi-v">${k.success_pct != null ? k.success_pct + '%' : '—'}</div><div class="kpi-s">${needLook ? `${needLook} need a look` : 'all clean'}</div></div>
    <div class="card"><div class="tile-l">Median duration</div><div class="kpi-v">${k.median_ms ? fmtDuration(k.median_ms) : '—'}</div><div class="kpi-s">per run</div></div>
    <div class="card"><div class="tile-l">Next run</div><div class="kpi-v">${soonest ? esc(relTime(soonest.t)) : '—'}</div><div class="kpi-s">${soonest ? esc(dispatchLabel(soonest.c, 28)) : ''}</div></div>
  </div>`;

  // Week grid: dispatch rows × days
  const days = lastDays(dashDays);
  const rowsById = new Map();
  for (const c of active) rowsById.set(c.id, { name: dispatchLabel(c, 34), agent: c.agent, runs: [] });
  for (const r of runs) {
    const key = r.dispatch_id && rowsById.has(r.dispatch_id) ? r.dispatch_id : (r.dispatch_id ? r.dispatch_id : 'other');
    if (!rowsById.has(key)) rowsById.set(key, { name: key === 'other' ? 'Manual / other' : runName(r), runs: [] });
    rowsById.get(key).runs.push(r);
  }
  const dayHead = days.map(d => `<th>${dashDays === 7 ? d.date.toLocaleDateString('en-US', { weekday: 'short' }) : (d.date.getDate() === 1 || d === days[0] ? d.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : d.date.getDate())}</th>`).join('');
  const gridRows = [...rowsById.values()].filter(row => row.runs.length || row.agent).map(row => {
    const cells = days.map(d => {
      const dayRuns = row.runs.filter(r => localDayKey(new Date(r.started_at)) === d.key);
      if (!dayRuns.length) return `<td class="c"></td>`;
      const tipOf = r => `${fmtTime(r.started_at)} · ${statusText(r.status, r.sources)}${r.sources != null ? `\n${r.sources} sources` : ''}${r.run_ms ? `\n${fmtDuration(r.run_ms)}` : ''}${r.missing_sections?.length ? `\nmissing: ${r.missing_sections.join(', ')}` : ''}`;
      if (dashDays > 7) {
        const worst = dayRuns.reduce((a, r) => TONE_RANK[runTone(r.status, r.sources)] > TONE_RANK[a] ? runTone(r.status, r.sources) : a, 'none');
        const last = dayRuns[dayRuns.length - 1];
        return `<td class="c"><button class="dot t-${worst}" data-tip="${esc(`${row.name} · ${d.date.toLocaleDateString()}\n${dayRuns.length} run${dayRuns.length > 1 ? 's' : ''}\n` + dayRuns.map(r => statusText(r.status, r.sources)).join(', '))}" aria-label="${dayRuns.length} runs" onclick="openRunDrawer(${last.id})"></button></td>`;
      }
      return `<td class="c">${dayRuns.map(r => `<button class="dot t-${runTone(r.status, r.sources)}" data-tip="${esc(row.name + '\n' + tipOf(r))}" aria-label="${esc(statusText(r.status, r.sources))}" onclick="openRunDrawer(${r.id})"></button>`).join('')}</td>`;
    }).join('');
    return `<tr><td class="rl" title="${esc(row.name)}">${esc(row.name)}</td>${cells}</tr>`;
  }).join('');
  const statusLegend = `<div class="legend">${STATUS_SERIES.map(s => `<span><i style="background:${s.color};border-radius:50%"></i>${s.label}</span>`).join('')}</div>`;

  const provRows = Object.entries(st.providers).filter(([, p]) => p.calls).sort((a, b) => b[1].hits - a[1].hits).map(([n, p]) =>
    `<tr><td>${esc(n)}</td><td class="r">${p.calls}</td><td class="r">${(p.hits / Math.max(1, p.ok)).toFixed(1)}</td><td class="r${p.errors ? ' err' : ''}">${p.errors ? Math.round(p.errors / p.calls * 100) + '%' : '0%'}</td><td class="r">${p.ms ? fmtMs(Math.round(p.ms / p.calls)) : '—'}</td></tr>`).join('');
  const dmax = Math.max(1, ...st.domains.map(d => d[1]));
  const domRows = st.domains.map(([d, n]) => `<div class="bar-row"><span class="l" title="${esc(d)}">${esc(d)}</span><span class="t"><span class="f" style="display:block;width:${(n / dmax * 100).toFixed(1)}%"></span></span><span class="v">${n}</span></div>`).join('');

  el.innerHTML = `<div class="dash">${range}${kpis}<div class="dash-grid">
    <div class="card wide"><div class="card-h">Runs by dispatch</div><div class="card-s">Each dot is a run, colored by outcome; click to open it.</div>
      <div style="overflow-x:auto"><table class="wgrid"><thead><tr><th class="rl"></th>${dayHead}</tr></thead><tbody>${gridRows || `<tr><td class="meta">No runs in range.</td></tr>`}</tbody></table></div>${statusLegend}</div>
    <div class="card"><div class="card-h">Runs per day</div><div class="card-s">By outcome</div><div class="chart" id="ch-daily"></div>${statusLegend}</div>
    <div class="card"><div class="card-h">Where the time goes</div><div class="card-s">Last 30 runs, duration by phase; click a column to open the run.</div><div class="chart" id="ch-phases"></div>
      <div class="legend">${PHASES.map(p => `<span><i style="background:${p.color}"></i>${p.label}</span>`).join('')}</div></div>
    <div class="card"><div class="card-h">Synthesizer input vs time</div><div class="card-s">Characters sent to the synthesizer against its duration, one dot per run.</div><div class="chart" id="ch-synth"></div></div>
    <div class="card"><div class="card-h">Search providers</div><div class="card-s">Calls, hits per successful call, error rate, average latency</div>
      ${provRows ? `<table class="mt"><thead><tr><th>Provider</th><th class="r">Calls</th><th class="r">Hits/call</th><th class="r">Errors</th><th class="r">Avg</th></tr></thead><tbody>${provRows}</tbody></table>` : '<div class="meta">No searches in range.</div>'}</div>
    <div class="card"><div class="card-h">Top source domains</div><div class="card-s">Sources that reached the synthesizer</div>${domRows ? `<div class="bars-h">${domRows}</div>` : '<div class="meta">No source data in range.</div>'}</div>
  </div></div>`;
  drawDashCharts();
}

function drawDashCharts() {
  if (!dashData) return;
  const runs = dashData.runs.filter(r => r.status);
  const days = lastDays(dashDays);
  const daily = document.getElementById('ch-daily');
  if (daily) {
    const cols = days.map(d => {
      const v = { good: 0, warn: 0, crit: 0, none: 0 };
      runs.filter(r => localDayKey(new Date(r.started_at)) === d.key).forEach(r => { v[runTone(r.status, r.sources)]++; });
      const total = v.good + v.warn + v.crit + v.none;
      return {
        label: dashDays === 7 ? d.date.toLocaleDateString('en-US', { weekday: 'short' }) : String(d.date.getDate()),
        values: v,
        tip: `${total} run${total === 1 ? '' : 's'} · ${d.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}\n` + STATUS_SERIES.filter(s => v[s.key]).map(s => `${s.label}: ${v[s.key]}`).join('\n'),
      };
    });
    daily.innerHTML = stackedColumnsSVG(daily.clientWidth || 400, 170, cols, STATUS_SERIES, v => String(Math.round(v)), 'count');
  }
  const phases = document.getElementById('ch-phases');
  if (phases) {
    const recent = runs.filter(r => r.phases && Object.keys(r.phases).length).slice(-30);
    const cols = recent.map(r => {
      const g = phaseGroups(r.phases);
      return {
        label: new Date(r.started_at).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' }),
        values: g,
        tip: `${runName(r)} · ${fmtTime(r.started_at)}\n${r.run_ms ? 'total ' + fmtDuration(r.run_ms) + '\n' : ''}` + PHASES.filter(p => g[p.key]).map(p => `${p.label}: ${fmtDuration(g[p.key])}`).join('\n'),
        onclick: `openRunDrawer(${r.id})`,
      };
    });
    phases.innerHTML = cols.length ? stackedColumnsSVG(phases.clientWidth || 400, 170, cols, PHASES, v => v ? fmtDuration(v) : '0', 'ms') : '<div class="meta">No phase timings in range.</div>';
  }
  const synth = document.getElementById('ch-synth');
  if (synth) {
    const pts = runs.filter(r => r.synth_chars && r.synth_ms).map(r => ({
      x: r.synth_chars, y: r.synth_ms,
      tip: `${fmtDuration(r.synth_ms)} · ${fmtCompact(r.synth_chars)} chars\n${runName(r)} · ${fmtTime(r.started_at)}${r.tokens?.[0] ? `\n${fmtCompact(r.tokens[0])} tokens in (whole run)` : ''}`,
      onclick: `openRunDrawer(${r.id})`,
    }));
    synth.innerHTML = pts.length ? scatterSVG(synth.clientWidth || 400, 170, pts, v => fmtCompact(v), v => v ? fmtDuration(v) : '0') : '<div class="meta">No synthesizer data in range.</div>';
  }
}

// ── Active table: per-dispatch stats from /api/stats ──
let activeSort = { key: 'next', dir: 1 };
let activeQuery = '';
function dispatchRunStats(id, runs) {
  const mine = runs.filter(r => r.dispatch_id === id && r.status);
  const done = mine.filter(r => r.status === 'done').length;
  const durs = mine.map(r => r.run_ms).filter(Boolean);
  const days = lastDays(7).map(d => {
    const dr = mine.filter(r => localDayKey(new Date(r.started_at)) === d.key);
    const tone = dr.reduce((a, r) => TONE_RANK[runTone(r.status, r.sources)] > TONE_RANK[a] ? runTone(r.status, r.sources) : a, 'none');
    return { d, n: dr.length, tone: dr.length ? tone : null };
  });
  return {
    runs: mine.length,
    success: mine.length ? done / mine.length : null,
    avgMs: durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : null,
    days,
  };
}
function statusSparkHTML(days) {
  return `<span class="spark">${days.map(x => `<span class="spark-bar t-${x.tone || 'none'}" style="height:${x.n ? 14 : 3}px" data-tip="${esc(`${x.d.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}\n${x.n ? `${x.n} run${x.n > 1 ? 's' : ''} · ${STATUS_SERIES.find(s => s.key === x.tone)?.label || ''}` : 'no runs'}`)}"></span>`).join('')}</span>`;
}
function sortActive(key) {
  activeSort = activeSort.key === key ? { key, dir: -activeSort.dir } : { key, dir: key === 'name' || key === 'agent' || key === 'next' ? 1 : -1 };
  renderContent();
}
function filterActive(q) {
  activeQuery = q;
  renderActiveRows();
}

let activeRowsData = [];
let activeKind = 'active';
function renderDispatchesTable(dispatches, kind) {
  const el = document.getElementById('content');
  if (!dispatches.length) {
    el.innerHTML = `<div class="empty-state">${kind === 'active' ? 'No active agents.' : 'No archived agents.'}</div>`;
    return;
  }
  const st = statsCache[30]?.data;
  if (!statsCache[30] || Date.now() - statsCache[30].at > 60000) {
    loadStats(30).then(d => { if (d && d !== st && !isMobile() && dispatchTab === kind) renderContent(); });
  }
  const runs = st?.runs || [];
  activeKind = kind;
  activeRowsData = dispatches.map(c => ({ c, st: dispatchRunStats(c.id, runs), next: kind === 'active' ? nextRun(c.schedule, null, c.timezone) : null }));
  const th = (key, label, cls) => `<th class="sort${cls ? ' ' + cls : ''}" onclick="sortActive('${key}')" aria-sort="${activeSort.key === key ? (activeSort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${label}<span class="arr">${activeSort.key === key ? (activeSort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
  el.innerHTML = `<div style="padding:16px 24px 80px">
    <div class="tbl-bar"><input class="input" placeholder="Filter by name, agent or prompt" value="${esc(activeQuery)}" oninput="filterActive(this.value)" aria-label="Filter dispatches"><span class="meta" id="tbl-count"></span>
      <span class="meta" style="margin-left:auto">Success and average over 30 days</span></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto">
      <table class="agents-table">
        <thead><tr style="background:var(--panel-2)">
          ${th('agent', 'Agent')}${th('name', 'Dispatch')}${kind === 'active' ? th('next', 'Next run') : '<th>Schedule</th>'}${th('last', 'Last run')}
          ${th('runs', 'Runs', 'r')}${th('success', 'Success', 'r')}${th('avg', 'Avg', 'r')}<th class="r">${kind === 'active' ? 'Last 7' : 'Status'}</th><th class="r">Actions</th>
        </tr></thead>
        <tbody id="dispatch-rows"></tbody>
      </table>
    </div>
  </div>`;
  renderActiveRows();
}

function renderActiveRows() {
  const tb = document.getElementById('dispatch-rows');
  if (!tb) return;
  const kind = activeKind;
  const q = activeQuery.trim().toLowerCase();
  const rows = activeRowsData.filter(x => !q || [dispatchLabel(x.c, 80), x.c.agent, x.c.prompt, allAgents.find(a => a.name === x.c.agent)?.label]
    .some(v => (v || '').toLowerCase().includes(q)));
  const val = x => {
    switch (activeSort.key) {
      case 'name': return dispatchLabel(x.c, 80).toLowerCase();
      case 'agent': return (allAgents.find(a => a.name === x.c.agent)?.label || x.c.agent || '').toLowerCase();
      case 'next': return x.next ? x.next.getTime() : Infinity;
      case 'last': return x.c.last_started_at ? Date.parse(x.c.last_started_at) : 0;
      case 'runs': return x.c.run_count || 0;
      case 'success': return x.st.success ?? -1;
      case 'avg': return x.st.avgMs ?? -1;
    }
    return 0;
  };
  rows.sort((a, b) => { const va = val(a), vb = val(b); return (va < vb ? -1 : va > vb ? 1 : 0) * activeSort.dir; });
  const cnt = document.getElementById('tbl-count');
  if (cnt) cnt.textContent = q ? `${rows.length} of ${activeRowsData.length}` : '';

  const playIcon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="none"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>`;
  const editIcon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><line x1="14" y1="6" x2="18" y2="10"/></svg>`;
  const archIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><line x1="10" y1="13" x2="14" y2="13"/></svg>`;
  const trashIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`;

  tb.innerHTML = rows.map(({ c, st }) => {
    const runs = c.max_runs ? `${c.run_count}/${c.max_runs}` : `${c.run_count}`;
    const actions = kind === 'active'
      ? `<button class="btn btn-sm" title="Run now" onclick="event.stopPropagation();runDispatchNow(${c.id})">${playIcon}</button>
         <button class="btn btn-sm" onclick="event.stopPropagation();openAgentSheet(${c.id})">${editIcon} Edit</button>
         <button class="btn btn-ghost btn-sm" title="Archive" onclick="event.stopPropagation();toggleDispatch(${c.id},false)">${archIcon}</button>`
      : `<button class="btn btn-sm" onclick="event.stopPropagation();toggleDispatch(${c.id},true)">Enable</button>
         <button class="btn btn-ghost btn-sm btn-danger" title="Delete" onclick="event.stopPropagation();deleteDispatch(${c.id})">${trashIcon}</button>`;
    const schedCell = kind === 'active' ? nextRunCellHTML(c.schedule, c.timezone) : `<span class="meta-mono">${esc(humanizeCron(c.schedule, c.timezone))}</span>`;
    const lastCell = c.last_session_id
      ? `<div style="display:flex;flex-direction:column;gap:3px;align-items:flex-start">
           ${c.last_status ? metricsChipHTML(c.last_status, c.last_sources, c.last_run_ms, { onclick: `event.stopPropagation();openRunDrawer(${c.last_session_id})` }).replace(/ [▾▴]<\/button>$/, '</button>') : `<button class="mchip t-none" onclick="event.stopPropagation();openRunDrawer(${c.last_session_id})">open</button>`}
           <span class="meta-mono" style="font-size:10.5px">${esc(fmtRelTime(c.last_started_at))}</span></div>`
      : '<span class="meta">—</span>';
    return `<tr onclick="openAgentSheet(${c.id})">
      <td>${pillHTML(c.agent)}</td>
      <td><div style="font-weight:500">${esc(dispatchLabel(c, 40))}</div><div style="color:var(--fg-3);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.prompt)}</div></td>
      <td>${schedCell}</td>
      <td>${lastCell}</td>
      <td class="r"><span class="mono" style="color:var(--fg-2)">${runs}</span></td>
      <td class="r"><span class="mono" style="color:var(--fg-2)">${st.success != null ? Math.round(st.success * 100) + '%' : '—'}</span></td>
      <td class="r"><span class="mono" style="color:var(--fg-2)">${st.avgMs ? fmtDuration(Math.round(st.avgMs)) : '—'}</span></td>
      <td class="r">${kind === 'active' ? statusSparkHTML(st.days) : statusBadgeHTML('archived')}</td>
      <td class="r"><div style="display:inline-flex;gap:4px" onclick="event.stopPropagation()">${actions}</div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="meta" style="padding:16px">No matches.</td></tr>`;
}

// ── Sidebar collapse ──
function setSidebarCollapsed(collapsed) {
  document.getElementById('app').classList.toggle('sb-collapsed', collapsed);
  try { localStorage.setItem('dispatch-sidebar-collapsed', collapsed ? '1' : '0'); } catch {}
  if (!collapsed && document.querySelector('.dash')) drawDashCharts();

// ── Agent Sheet ──
async function openAgentSheet(dispatchIdOrObj) {
  if (!allAgents.length) {
    setStatus('create an agent first');
    openAgentConfigSheet(null);
    return;
  }

  let dispatch = null;
  if (dispatchIdOrObj !== null && typeof dispatchIdOrObj === 'number') {
    const res = await fetch('/api/dispatches', { headers: headers() });
    if (res.ok) {
      const dispatches = await res.json();
      dispatch = dispatches.find(d => d.id === dispatchIdOrObj) || null;
    }
  } else if (dispatchIdOrObj && typeof dispatchIdOrObj === 'object') {
    dispatch = dispatchIdOrObj;
  }

  sheetDispatch = dispatch;
  sheetCat = dispatch?.agent || sheetCat;
  if (!allAgents.find(a => a.name === sheetCat)) {
    sheetCat = allAgents[0].name;
  }
  sheetSchedMode = 'simple';
  sheetDays = [1,2,3,4,5];
  sheetLabel = isAutoLabel(dispatch?.label) ? '' : (dispatch?.label || '');
  sheetPrompt = dispatch?.prompt || '';

  if (dispatch?.schedule && dispatch.trigger_type !== 'once') {
    sheetScheduleStr = dispatch.schedule;
    const parts = dispatch.schedule.trim().split(/\s+/);
    if (parts.length === 5) {
      const [mm, hh,,,dow] = parts;
      if (/^\d+$/.test(hh) && /^\d+$/.test(mm)) {
        sheetTime = `${hh.padStart(2,'0')}:${mm.padStart(2,'0')}`;
      }
      const isHourly = dispatch.schedule === '0 * * * *';
      const isDaily = /^\d+ \d+ \* \* \*$/.test(dispatch.schedule);
      const isWeekly = /^\d+ \d+ \* \* \d(,\d)*$/.test(dispatch.schedule);
      sheetFreq = isHourly ? 'hourly' : isDaily ? 'daily' : isWeekly ? 'weekly' : 'custom';
      if (sheetFreq === 'custom') { sheetSchedMode = 'custom'; sheetFreq = 'daily'; }
      if (isWeekly) sheetDays = parts[4].split(',').map(d => +d % 7);
    }
  } else {
    sheetScheduleStr = dispatch?.schedule || '0 8 * * *';
    sheetFreq = 'daily';
    sheetTime = '08:00';
  }

  document.getElementById('sheet-title').textContent = dispatch ? 'Edit dispatch' : 'New dispatch';
  renderSheetBody();
  document.getElementById('agent-sheet').classList.add('open');
}

function closeAgentSheet() {
  document.getElementById('agent-sheet').classList.remove('open');
  sheetDispatch = null;
}

function renderSheetBody() {
  const dispatch = sheetDispatch;
  const isEdit = !!dispatch;

  const catKeys = allAgents.map(a => a.name);
  const catPicker = catKeys.map(k => {
    const isActive = k === sheetCat;
    const title = allAgents.find(a => a.name === k)?.label || CATEGORIES[k]?.label || k;
    return `<button class="cat-pick-btn${isActive ? ' active' : ''}" onclick="sheetSetCat('${k}')" title="${esc(title)}">${pillHTML(k, !isActive)}</button>`;
  }).join('');

  const schedModeHTML = `<div class="sched-mode">
    <button class="sched-mode-btn${sheetSchedMode==='simple'?' active':''}" onclick="sheetSetSchedMode('simple')">Simple</button>
    <button class="sched-mode-btn${sheetSchedMode==='custom'?' active':''}" onclick="sheetSetSchedMode('custom')">Custom</button>
  </div>`;

  let schedContent = '';
  if (sheetSchedMode === 'simple') {
    const dayLabels = ['S','M','T','W','T','F','S'];
    const dayPicker = (sheetFreq === 'weekly') ? `<div class="day-picker" style="margin-top:8px">
      ${dayLabels.map((d,i) => `<button class="day-btn${sheetDays.includes(i)?' active':''}" onclick="sheetToggleDay(${i})">${d}</button>`).join('')}
    </div>` : '';
    const preview = sheetScheduleStr;
    schedContent = `<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <select class="select" style="flex:0 0 130px" onchange="sheetSetFreq(this.value)">
          <option value="hourly"${sheetFreq==='hourly'?' selected':''}>Hourly</option>
          <option value="daily"${sheetFreq==='daily'?' selected':''}>Daily</option>
          <option value="weekly"${sheetFreq==='weekly'?' selected':''}>Weekly</option>
        </select>
        <span class="meta" style="flex-shrink:0">at</span>
        <input class="input mono-input" value="${esc(sheetTime)}" style="flex:0 0 100px" oninput="sheetSetTime(this.value)" type="time">
      </div>
      ${dayPicker}
      <div class="meta-mono" style="font-size:11px">↳ schedule <span id="sheet-sched-preview" style="color:var(--fg-2)">${esc(sheetBuildSchedule())}</span></div>
      <div class="meta-mono" style="font-size:11px;color:var(--fg-3)">${Intl.DateTimeFormat().resolvedOptions().timeZone}</div>
    </div>`;
  } else {
    schedContent = `<div style="display:flex;flex-direction:column;gap:8px">
      <input class="input mono-input" value="${esc(sheetScheduleStr)}" oninput="sheetSetScheduleStr(this.value)" placeholder="0 8 * * *">
      <div class="meta-mono" style="font-size:11px">↳ <span id="sheet-cron-preview">${esc(humanizeCron(sheetScheduleStr))}</span></div>
    </div>`;
  }

  const promptVal = esc(sheetPrompt);
  const labelVal = esc(sheetLabel);
  const untilVal = dispatch?.repeat_until ? dispatch.repeat_until.slice(0,10) : '';
  const maxVal = dispatch?.max_runs != null ? dispatch.max_runs : '';

  document.getElementById('sheet-body').innerHTML = `
    <div class="field"><div class="field-lbl">Category</div><div class="cat-picker">${catPicker}</div></div>
    <div class="field">
      <div class="field-lbl">Label</div>
      <input class="input" id="s-label" placeholder="e.g. SF Food Briefing" value="${labelVal}" oninput="sheetLabel=this.value">
      <div class="field-hint">Short, human-readable</div>
    </div>
    ${(() => { const needsPrompt = allAgents.find(a => a.name === sheetCat)?.requires_prompt; return `<div class="field">
      <div class="field-lbl">Prompt${needsPrompt ? ' *' : ''}</div>
      <textarea class="textarea" id="s-prompt" rows="4" placeholder="${needsPrompt ? 'Required — what should the agent answer or fetch?' : 'Optional — leave blank to use the agent\'s built-in goal'}" style="resize:vertical" oninput="sheetPrompt=this.value">${promptVal}</textarea>
    </div>`; })()}
    <div class="field">
      <div class="field-lbl">Schedule</div>
      ${schedModeHTML}
      ${schedContent}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="field"><div class="field-lbl">Until</div><input class="input mono-input" id="s-until" placeholder="never" type="date" value="${untilVal}"></div>
      <div class="field"><div class="field-lbl">Max runs</div><input class="input mono-input" id="s-maxruns" placeholder="∞" type="number" min="1" value="${maxVal}"></div>
    </div>
  `;

  const archBtn = isEdit
    ? `<button class="btn btn-sm btn-danger" style="margin-right:auto" onclick="archiveDispatchFromSheet()">${dispatch.enabled ? 'Archive' : 'Enable'}</button>` : '';
  document.getElementById('sheet-ftr').innerHTML = `
    ${archBtn}
    <button class="btn btn-sm" style="margin-left:${isEdit?'0':'auto'}" onclick="closeAgentSheet()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveAgent()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>
      ${isEdit ? 'Save' : 'Create agent'}
    </button>
  `;
}

function sheetSetCat(k) { sheetCat = k; renderSheetBody(); }
function sheetSetSchedMode(m) { sheetSchedMode = m; renderSheetBody(); }
function sheetSetFreq(v) { sheetFreq = v; renderSheetBody(); }
// Typing in these inputs only updates the preview: re-rendering would replace the input mid-edit
// (loses focus, and crashes Safari's native time picker).
function sheetSetTime(v) {
  sheetTime = v;
  const el = document.getElementById('sheet-sched-preview');
  if (el) el.textContent = sheetBuildSchedule();
}
function sheetSetScheduleStr(v) {
  sheetScheduleStr = v;
  const el = document.getElementById('sheet-cron-preview');
  if (el) el.textContent = humanizeCron(sheetScheduleStr);
}
function sheetToggleDay(i) {
  if (sheetDays.includes(i)) sheetDays = sheetDays.filter(d => d !== i);
  else sheetDays = [...sheetDays, i].sort();
  renderSheetBody();
}

function sheetBuildSchedule() {
  if (sheetSchedMode === 'custom') return sheetScheduleStr;
  const [lhh, lmm] = sheetTime.split(':').map(Number);
  if (sheetFreq === 'hourly') return '0 * * * *';
  if (sheetFreq === 'daily') return `${lmm} ${lhh} * * *`;
  if (sheetFreq === 'weekly') {
    const dow = sheetDays.length ? sheetDays.sort().join(',') : '1';
    return `${lmm} ${lhh} * * ${dow}`;
  }
  return `${lmm} ${lhh} * * *`;
}

async function saveAgent() {
  const label = document.getElementById('s-label')?.value.trim() || '';
  const prompt = document.getElementById('s-prompt')?.value.trim() || '';
  const untilVal = document.getElementById('s-until')?.value || '';
  const maxVal = document.getElementById('s-maxruns')?.value || '';
  const agentRequiresPrompt = allAgents.find(a => a.name === sheetCat)?.requires_prompt;
  if (agentRequiresPrompt && !prompt) { setStatus('prompt required for this agent'); return; }
  const schedule = sheetBuildSchedule();
  const payload = {
    agent: sheetCat,
    prompt,
    label,
    schedule,
    timezone: BROWSER_TZ,
    trigger_type: 'cron',
    repeat_until: untilVal ? new Date(untilVal).toISOString() : null,
    max_runs: maxVal ? parseInt(maxVal) : null,
  };
  try {
    const isEdit = !!sheetDispatch?.id;
    const res = await fetch(isEdit ? `/api/dispatches/${sheetDispatch.id}` : '/api/dispatches', {
      method: isEdit ? 'PUT' : 'POST',
      headers: headers(),
      body: JSON.stringify(payload),
    });
    if (!res.ok) { setStatus('error saving'); return; }
    setStatus(isEdit ? 'saved' : 'agent created');
    closeAgentSheet();
    await refreshAll();
  } catch { setStatus('failed'); }
}

async function archiveDispatchFromSheet() {
  if (!sheetDispatch?.id) return;
  const newEnabled = !sheetDispatch.enabled;
  await fetch(`/api/dispatches/${sheetDispatch.id}`, {
    method: 'PATCH', headers: headers(),
    body: JSON.stringify({ enabled: newEnabled }),
  });
  setStatus(newEnabled ? 'enabled' : 'archived');
  closeAgentSheet();
  await refreshAll();
}

// ── Data loading ──
async function loadSessions() {
  const agent = activeFilter === 'all' ? '' : `&agent=${activeFilter}`;
  try {
    const sr = await fetch(`/api/sessions?limit=100${agent}`, { headers: headers() });
    if (!sr.ok) return;
    allSessions = await sr.json();
    renderSidebar();
    if (mobileTab === 'runs') renderMobileContent();
  } catch {}
}

async function loadDispatches() {
  try {
    const r = await fetch('/api/dispatches', { headers: headers() });
    if (!r.ok) return;
    allDispatches = await r.json();
    updateTopbar();
    renderSidebar();
  } catch {}
}

async function loadDigest() {
  try {
    const r = await fetch('/api/dispatches/digest', { headers: headers() });
    if (!r.ok) return;
    digestItems = await r.json();
    updateTopbar();
  } catch {}
}

async function refreshAll() {
  await Promise.all([loadSessions(), loadDispatches(), loadDigest(), loadAgents()]);
  renderDispatch();
}

// ── Dispatch actions ──
async function toggleDispatch(id, enabled) {
  await fetch(`/api/dispatches/${id}`, {
    method: 'PATCH', headers: headers(),
    body: JSON.stringify({ enabled }),
  });
  setStatus(enabled ? 'enabled' : 'archived');
  await refreshAll();
}

async function deleteDispatch(id) {
  if (!confirm('Delete this agent?')) return;
  await fetch(`/api/dispatches/${id}`, { method: 'DELETE', headers: headers() });
  setStatus('deleted');
  await refreshAll();
}

async function runDispatchNow(id) {
  const cron = allDispatches.find(c => c.id === id);
  if (!cron) return;
  const res = await fetch('/api/jobs', {
    method: 'POST', headers: headers(),
    body: JSON.stringify({ agent: cron.agent, messages: [{ role: 'user', content: cron.prompt }], dispatch_id: id }),
  });
  if (!res.ok) { setStatus('error'); return; }
  const { session_id } = await res.json();
  await jobStarted(session_id, cron.agent);
}

// ── Job tracking ──
// One poll of /api/jobs/active drives every running indicator; nothing opens on its own.
function jobForSession(sessionId) {
  for (const j of activeJobs.values()) if (j.session_id === sessionId) return j;
  return null;
}

function jobName(j) {
  const d = j.dispatch_id && allDispatches.find(x => x.id === j.dispatch_id);
  if (d) return dispatchLabel(d, 32);
  return allAgents.find(a => a.name === j.agent)?.label || j.agent || 'run';
}

function fmtElapsed(iso) {
  const secs = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return secs < 60 ? `${secs}s` : `${Math.floor(secs / 60)}m ${String(secs % 60).padStart(2, '0')}s`;
}

function runStatusHTML(sessionId) {
  const j = jobForSession(sessionId);
  if (!j) return '';
  if (j.status === 'queued') return `<span class="qbadge">queued${j.queue_position ? ' #' + j.queue_position : ''}</span>`;
  return `<span class="qbadge running">${esc(j.step || 'running')}</span><span class="meta-mono" style="font-size:10.5px">${fmtElapsed(j.started_at)}</span>`;
}

function renderRunIndicators() {
  const jobs = [...activeJobs.values()];
  const running = jobs.filter(j => j.status === 'running');
  const queued = jobs.length - running.length;
  let text = '';
  if (jobs.length === 1) {
    const j = jobs[0];
    text = j.status === 'queued' ? `${jobName(j)} · queued` : `${jobName(j)} · ${j.step || 'running'} · ${fmtElapsed(j.started_at)}`;
  } else if (jobs.length > 1) {
    text = `${running.length} running${queued ? ` · ${queued} queued` : ''}`;
  }
  // The mobile header has little room: step (one job) or count only.
  const shortText = jobs.length === 1 ? (jobs[0].status === 'queued' ? 'queued' : (jobs[0].step || 'running')) : String(jobs.length);
  for (const [id, label] of [['run-pill', text], ['run-pill-m', shortText]]) {
    const pill = document.getElementById(id);
    if (!pill) continue;
    pill.hidden = !jobs.length;
    pill.innerHTML = jobs.length ? `<i class="run-dot"></i><span class="run-pill-text">${esc(label)}</span>` : '';
    pill.title = jobs.map(j => `${jobName(j)}: ${j.status === 'queued' ? 'queued' : (j.step || 'running')}`).join('\n');
  }
  const mdot = document.getElementById('mtab-runs-dot');
  if (mdot) mdot.hidden = !jobs.length;
  document.querySelectorAll('.run-status[data-session]').forEach(el => {
    el.innerHTML = runStatusHTML(+el.dataset.session);
  });
}

function openRunPill() {
  if (activeJobs.size === 1) { openRunDrawer([...activeJobs.values()][0].session_id); return; }
  if (isMobile()) setMobileTab('runs');
  else setSidebarMode('runs');
}

async function pollJobs() {
  clearTimeout(jobsTimer);
  try {
    const r = await fetch('/api/jobs/active', { headers: headers() });
    if (r.ok) {
      const prev = activeJobs;
      activeJobs = new Map((await r.json()).filter(j => j.session_id).map(j => [j.job_id, j]));
      const finished = [...prev.values()].filter(j => !activeJobs.has(j.job_id));
      const changed = finished.length || [...activeJobs.values()].some(j => prev.get(j.job_id)?.status !== j.status);
      if (finished.length) await jobsFinished(finished);
      else if (changed) await loadSessions();
      updateModeBtns();
      renderRunIndicators();
      await refreshOpenRun();
    }
  } catch {}
  if (activeJobs.size && !tickTimer) tickTimer = setInterval(renderRunIndicators, 1000);
  if (!activeJobs.size && tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  jobsTimer = setTimeout(pollJobs, activeJobs.size ? 3000 : 30000);
}

// Keep an open drawer on an active (or just-finished) run up to date without resetting scroll.
let refreshedFinishedSession = null;
async function refreshOpenRun() {
  const id = runDrawerSessionId;
  if (!id || !document.getElementById('run-drawer').classList.contains('open')) return;
  const active = !!jobForSession(id);
  if (!active && refreshedFinishedSession === id) return;
  refreshedFinishedSession = active ? null : id;
  try {
    const r = await fetch(`/api/sessions/${id}`, { headers: headers() });
    if (r.ok && runDrawerSessionId === id) renderRunDrawer(await r.json());
  } catch {}
}

async function jobsFinished(jobs) {
  invalidateStats();
  await Promise.all([loadSessions(), loadDigest(), loadDispatches()]);
  if (['digest', 'dashboard', 'active'].includes(dispatchTab) || ['digest', 'stats'].includes(mobileTab)) renderDispatch();
  if (jobs.some(j => j.session_id === runDrawerSessionId)) refreshedFinishedSession = null;
  if (jobs.length > 1) {
    setStatus(`${jobs.length} runs finished`, { label: 'View', fn: () => isMobile() ? setMobileTab('runs') : setSidebarMode('runs') });
    return;
  }
  const j = jobs[0];
  let status = 'done';
  try {
    const r = await fetch(`/api/jobs/${j.job_id}`, { headers: headers() });
    if (r.ok) status = (await r.json()).status;
  } catch {}
  const msg = status === 'done' ? `${jobName(j)} finished ✓` : `${jobName(j)} ${status}`;
  setStatus(msg, { label: 'View', fn: () => openRunDrawer(j.session_id) });
}

async function jobStarted(sessionId, agent) {
  await pollJobs();
  await loadSessions();
  const name = allAgents.find(a => a.name === agent)?.label || agent || 'Run';
  setStatus(`${name} started`, sessionId ? { label: 'View', fn: () => openRunDrawer(sessionId) } : undefined);
}

async function cancelJob(jobId) {
  if (!jobId) return;
  await fetch(`/api/jobs/${jobId}`, { method: 'DELETE', headers: headers() });
  setStatus('cancelled');
  await pollJobs();
}

async function exportAgentConfig(name) {
  const url = `/api/agents/${encodeURIComponent(name)}/export`;
  const r = await fetch(url, { headers: headers() });
  if (!r.ok) { setStatus('export failed'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}.yaml`;
  a.click();
}

async function importAgentYAML(input) {
  const file = input.files[0];
  if (!file) return;
  const text = await file.text();
  const r = await fetch('/api/agents/import', {
    method: 'POST',
    headers: { ...headers(), 'Content-Type': 'text/yaml' },
    body: text,
  });
  if (!r.ok) { setStatus('import failed'); return; }
  const d = await r.json();
  setStatus(`${d.action}: ${d.name}`);
  await loadAgents();
  renderContent();
  input.value = '';
}

async function deleteAgentConfig(name) {
  if (!confirm(`Delete agent "${name}"? This cannot be undone.`)) return;
  const r = await fetch(`/api/agents/${encodeURIComponent(name)}`, { method: 'DELETE', headers: headers() });
  if (!r.ok) { setStatus('delete failed'); return; }
  setStatus('deleted');
  await loadAgents();
  renderContent();
}

      .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-{2,}/g, '-');
    const after = before.toLowerCase()
      .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-{2,}/g, '-');
    this.setSelectionRange(after.length, after.length);

  updateCfgSubWarning();

  const deleteBtn = (name && !isBuiltin)
    ? `<button class="btn btn-ghost btn-sm btn-danger" onclick="deleteAgentConfig('${esc(name)}').then(closeAgentConfigSheet)" style="margin-right:auto">Delete</button>`
