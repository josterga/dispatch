<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --sidebar-w: 280px;
}

body {
  --bg:        oklch(0.16 0.005 260);
  --bg-2:      oklch(0.19 0.006 260);
  --bg-3:      oklch(0.22 0.007 260);
  --panel:     oklch(0.205 0.006 260);
  --panel-2:   oklch(0.235 0.008 260);
  --line:      oklch(0.30 0.008 260);
  --line-2:    oklch(0.36 0.010 260);
  --fg:        oklch(0.96 0.005 260);
  --fg-2:      oklch(0.78 0.008 260);
  --fg-3:      oklch(0.58 0.010 260);
  --fg-4:      oklch(0.42 0.010 260);
  --accent:    oklch(0.78 0.16 150);
  --accent-bg: oklch(0.30 0.10 150);
  --accent-fg: oklch(0.94 0.06 150);
  --link:      oklch(0.74 0.14 230);
  --danger:    oklch(0.70 0.18 25);
  --warn:      oklch(0.78 0.15 75);
  --shadow:    0 8px 24px -8px oklch(0 0 0 / 0.6);
  --shadow-lg: 0 24px 60px -16px oklch(0 0 0 / 0.7);
  color-scheme: dark;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 13px;
  height: 100dvh;
  overflow: hidden;
}

body.theme-light {
  --bg:        oklch(0.985 0.003 100);
  --bg-2:      oklch(0.965 0.004 100);
  --bg-3:      oklch(0.945 0.005 100);
  --panel:     oklch(1 0 0);
  --panel-2:   oklch(0.975 0.003 100);
  --line:      oklch(0.90 0.005 100);
  --line-2:    oklch(0.82 0.008 100);
  --fg:        oklch(0.20 0.010 260);
  --fg-2:      oklch(0.36 0.010 260);
  --fg-3:      oklch(0.50 0.010 260);
  --fg-4:      oklch(0.65 0.010 260);
  --accent:    oklch(0.50 0.15 150);
  --accent-bg: oklch(0.92 0.06 150);
  --accent-fg: oklch(0.30 0.12 150);
  --link:      oklch(0.50 0.15 230);
  --danger:    oklch(0.55 0.18 25);
  --warn:      oklch(0.60 0.15 75);
  --shadow:    0 4px 14px -4px oklch(0 0 0 / 0.10);
  --shadow-lg: 0 16px 40px -12px oklch(0 0 0 / 0.18);
  color-scheme: light;
}

/* ── Layout ── */
#app {
  display: flex;
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-brand {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sb-brand-name {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.sb-brand-name .accent { color: var(--accent); }

.mode-toggle {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.mode-toggle-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--fg-3);
  font-size: 12.5px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.mode-btn.active { background: var(--panel-2); color: var(--fg); }
body.theme-light .mode-btn.active { background: white; box-shadow: 0 1px 3px oklch(0 0 0 / 0.12); }
.seg-btn { padding: 7px 10px; border-radius: 5px; border: none; background: transparent; color: var(--fg-3); font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; cursor: pointer; transition: background 0.12s, color 0.12s; }
.seg-btn.active { background: var(--panel-2); color: var(--fg); }
body.theme-light .seg-btn.active { background: white; box-shadow: 0 1px 3px oklch(0 0 0 / 0.12); }
.mode-btn .cnt { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-4); }
.mode-btn.active .cnt { color: var(--fg-3); }

.filter-strip {
  padding: 8px 14px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.chip {
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg-3);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: all 0.12s;
}
.chip:hover { color: var(--fg); border-color: var(--line-2); }
.chip.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }

#sb-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px 14px;
}

.sb-item {
  display: block;
  width: 100%;
  padding: 10px 8px;
  border: none;
  border-radius: 6px;
  background: transparent;
  text-align: left;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
  color: var(--fg);
  transition: background 0.1s;
}
.sb-item:hover { background: var(--panel-2); }
.sb-item.active { background: var(--panel-2); }
.sb-item:last-child { border-bottom: none; }
.sb-item-row { display: flex; align-items: center; gap: 6px; }
.sb-item-title { margin-top: 5px; font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item-sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item-prompt { margin-top: 5px; font-size: 12.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item.unread .sb-item-prompt { color: var(--fg); }
.sb-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}

/* ── Main ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  background: var(--bg);
}

/* ── Topbar ── */
#topbar {
  padding: 14px 24px 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  flex-shrink: 0;
}
.topbar-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 6px;
}
.topbar-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.topbar-meta { color: var(--fg-3); font-size: 12px; margin-top: 2px; }
.topbar-actions { display: flex; gap: 6px; align-items: center; margin-top: 2px; }

.tabs { display: flex; gap: 2px; align-items: stretch; }
.tab {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-3);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: color 0.12s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.tab .tc { margin-left: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-4); }

/* ── Content ── */
#content { flex: 1; overflow-y: auto; min-height: 0; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-size: 12.5px; font-weight: 500; font-family: var(--font-sans);
  cursor: pointer; transition: background 0.12s, border-color 0.12s; white-space: nowrap;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--bg-3) !important; color: var(--fg) !important; border-color: transparent !important; }
.btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; color: oklch(0.18 0.05 150) !important; }
body.theme-light .btn-primary { color: white !important; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-sm { padding: 3px 8px !important; font-size: 11.5px !important; }
.btn-mono { font-family: var(--font-mono) !important; }
.btn-danger { color: var(--danger) !important; }

/* ── Pill ── */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  border: 1px solid transparent; white-space: nowrap; line-height: 1.4;
}

/* ── Status badge ── */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.status-badge.s-active { background: var(--accent-bg); color: var(--accent-fg); }
.status-badge.s-archived { background: var(--bg-3); color: var(--fg-3); }
.status-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.status-badge.s-active::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* ── Inputs ── */
.input, .select, .textarea {
  background: var(--bg); border: 1px solid var(--line); color: var(--fg);
  border-radius: 6px; padding: 7px 10px; font-size: 13px;
  font-family: var(--font-sans); width: 100%; outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
}
.mono-input { font-family: var(--font-mono) !important; }

/* ── Meta ── */
.meta { color: var(--fg-3); font-size: 12px; }
.meta-mono { color: var(--fg-3); font-family: var(--font-mono); font-size: 11.5px; }
.mono { font-family: var(--font-mono); }

/* ── Agents table ── */
.agents-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.agents-table th {
  text-align: left; padding: 9px 14px;
  font-size: 10.5px; font-family: var(--font-mono); font-weight: 600;
  color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.agents-table th.r { text-align: right; }
.agents-table td { padding: 11px 14px; vertical-align: middle; border-top: 1px solid var(--line); }
.agents-table td.r { text-align: right; }
.agents-table tbody tr { cursor: pointer; transition: background 0.1s; }
.agents-table tbody tr:hover td { background: var(--panel-2); }

/* ── Digest ── */
.digest-list { padding: 20px 24px 80px; max-width: 880px; margin: 0 auto; }
.digest-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.digest-card-hdr {
  padding: 14px 18px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.digest-card-hdr.open { border-bottom: 1px solid var(--line); }
.digest-card-title {
  margin: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.digest-card-body { padding: 16px 22px 22px; }
.digest-intro { margin: 0 0 12px; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
.digest-section {
  margin: 16px 0 8px; font-size: 11px; font-family: var(--font-mono);
  font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em;
}
.digest-bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.digest-bullet { padding-left: 16px; position: relative; font-size: 14px; line-height: 1.55; color: var(--fg-2); }
.digest-bullet::before {
  content: ""; position: absolute; left: 0; top: 9px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.digest-bullet-head { color: var(--fg); font-weight: 500; }
.digest-bullet-source { margin-top: 4px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.link-mono { color: var(--link); font-family: var(--font-mono); font-size: 11px; word-break: break-all; text-decoration: none; }
.link-mono:hover { text-decoration: underline; }

/* ── Run drawer ── */
#run-drawer {
  display: none; position: absolute; inset: 0; z-index: 40;
}
#run-drawer.open { display: block; }
.drawer-bd { position: absolute; inset: 0; background: oklch(0 0 0 / 0.4); }
/* Desktop: the drawer is a side panel; the rest of the page stays usable. */
@media (min-width: 641px) {
  #run-drawer { pointer-events: none; }
  #run-drawer .drawer-bd { display: none; }
  .run-drawer-panel { pointer-events: auto; }
}
.run-drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 480px;
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg); z-index: 1;
}
.drawer-hdr { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
.drawer-section-label {
  font-size: 10.5px; color: var(--fg-3); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); font-weight: 600;
}
.drawer-section-label + .drawer-section-label,
.drawer-section-label.mt { margin-top: 20px; }
.drawer-footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-shrink: 0; }

/* ── Agent sheet ── */
#agent-sheet, #agent-config-sheet, #settings-sheet {
  display: none; position: absolute; inset: 0; z-index: 50;
}
#agent-sheet.open, #agent-config-sheet.open, #settings-sheet.open { display: block; }
.sheet-bd { position: absolute; inset: 0; background: oklch(0 0 0 / 0.5); }
.agent-sheet-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 520px;
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg); z-index: 1;
}
.sheet-hdr { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; flex-shrink: 0; }
.sheet-body { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.sheet-ftr { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-shrink: 0; }
details[open] .adv-chevron { transform: rotate(0deg); }
.adv-chevron { transform: rotate(-90deg); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-lbl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
.field-hint { font-size: 11.5px; color: var(--fg-3); }
.sched-mode { display: flex; gap: 4px; margin-bottom: 10px; }
.sched-mode-btn {
  padding: 5px 12px; border-radius: 5px; border: 1px solid var(--line);
  background: transparent; color: var(--fg-3);
  font-family: var(--font-mono); font-size: 11px; cursor: pointer; transition: all 0.12s;
}
.sched-mode-btn.active { background: var(--bg-3); color: var(--fg); border-color: var(--line-2); }
.day-picker { display: flex; gap: 4px; flex-wrap: wrap; }
.day-btn {
  width: 36px; height: 32px; border-radius: 5px;
  border: 1px solid var(--line); background: transparent;
  color: var(--fg-3); font-family: var(--font-mono);
  font-weight: 600; font-size: 11px; cursor: pointer; transition: all 0.12s;
}
.day-btn.active { background: var(--accent-bg); color: var(--accent-fg); border-color: transparent; }
.cat-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-pick-btn {
  padding: 0; border: none; background: transparent; cursor: pointer;
  border-radius: 4px; outline: none; transition: outline 0.1s;
}
.cat-pick-btn.active { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Sparkline ── */
.spark { display: inline-flex; gap: 2px; align-items: flex-end; height: 18px; }
.spark-bar { width: 3px; border-radius: 1px; }

/* ── Status toast ── */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 16px; font-size: 12px; color: var(--fg); box-shadow: var(--shadow);
  z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ── Running/queued badge ── */
.qbadge {
  font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
  background: var(--bg-3); color: var(--fg-3);
  font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase;
}
.qbadge.running { background: var(--warn); color: oklch(0.18 0.05 75); }

/* ── Running indicators ── */
@keyframes run-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.run-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: run-pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
.run-pill {
  display: inline-flex; align-items: center; gap: 7px; max-width: 320px;
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg-3); color: var(--fg-2); cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
}
.run-pill:hover { color: var(--fg); }
.run-pill[hidden] { display: none; }
.run-pill .run-pill-text { overflow: hidden; text-overflow: ellipsis; }
#run-pill-m { max-width: 110px; padding: 4px 8px; }
.run-status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.mob-tab-btn { position: relative; }
.mob-tab-btn .run-dot { position: absolute; top: 4px; left: calc(50% + 8px); }
#toast.has-action { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
#toast .toast-action { background: none; border: none; padding: 0; color: var(--link); cursor: pointer; font: inherit; font-weight: 600; }

/* ── Markdown ── */
.md h1,.md h2,.md h3,.md h4 { color: var(--fg); font-weight: 700; margin: 1em 0 0.4em; line-height: 1.3; }
.md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 13px; } .md h4 { font-size: 12px; color: var(--fg-2); }
.md p { margin: 0.6em 0; } .md p:first-child { margin-top: 0; } .md p:last-child { margin-bottom: 0; }
.md ul,.md ol { padding-left: 1.4em; margin: 0.5em 0; } .md li { margin: 0.25em 0; }
.md a { color: var(--link); text-decoration: none; } .md a:hover { text-decoration: underline; }
.md code { background: var(--bg-3); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; font-size: 12px; font-family: var(--font-mono); }
.md pre { background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; overflow-x: auto; margin: 0.7em 0; }
.md pre code { background: none; border: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--fg-3); margin: 0.6em 0; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
.md table { border-collapse: collapse; width: 100%; margin: 0.7em 0; font-size: 12px; }
.md th,.md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.md th { background: var(--panel); font-weight: 700; }
.md strong { color: var(--fg); font-weight: 700; } .md em { color: var(--fg-2); }

/* ── Tool calls ── */
details.tool-call { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; overflow: hidden; }
details.tool-call summary { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; background: var(--panel); list-style: none; font-size: 11px; }
details.tool-call summary::-webkit-details-marker { display: none; }
details.tool-call summary::before { content: '▶'; font-size: 8px; color: var(--fg-3); transition: transform 0.15s; }
details[open].tool-call summary::before { transform: rotate(90deg); }
.tool-name { font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
.tool-dur { color: var(--fg-3); margin-left: auto; font-size: 10px; font-family: var(--font-mono); }
.tool-body { padding: 10px 12px; background: var(--bg-3); border-top: 1px solid var(--line); font-size: 11px; overflow-x: auto; font-family: var(--font-mono); }
.tool-body pre { white-space: pre-wrap; word-break: break-word; color: var(--fg-3); }
details.log-section summary { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); cursor: pointer; list-style: none; padding: 4px 0; user-select: none; font-family: var(--font-mono); }
details.log-section summary::-webkit-details-marker { display: none; }
.log-body { background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-top: 6px; font-size: 11px; color: var(--fg-3); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; font-family: var(--font-mono); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

/* ── Mobile header ── */
#mobile-header {
  display: none;
  padding: 14px 18px 10px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.mob-brand { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.06em; text-transform: uppercase; }
.mob-brand .accent { color: var(--accent); }
.mob-title { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.mob-title .cnt { margin-left: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--fg-3); font-weight: 500; }

/* ── Mobile tab bar ── */
#mobile-tabbar {
  display: none;
  align-items: center;
  border-top: 1px solid var(--line);
  background: var(--panel);
  padding: 8px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}
.mob-tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0; border: none; background: transparent; color: var(--fg-3); cursor: pointer; transition: color 0.12s;
}
.mob-tab-btn.active { color: var(--fg); }
.mob-tab-btn span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; }

/* ── Mobile bottom sheets ── */
.mob-sheet-overlay { display: none; position: absolute; inset: 0; z-index: 50; }
.mob-sheet-overlay.open { display: block; }
.mob-sheet-bd { position: absolute; inset: 0; background: oklch(0 0 0 / 0.5); }
.mob-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 24px;
  background: var(--panel); border-top: 1px solid var(--line);
  border-top-left-radius: 16px; border-top-right-radius: 16px;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column; z-index: 1; overflow: hidden;
}
.mob-run-sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--panel); border-top: 1px solid var(--line);
  border-top-left-radius: 16px; border-top-right-radius: 16px;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column; z-index: 1;
  max-height: 88%; overflow: hidden;
}
.handle-wrap { padding: 8px 0 4px; display: flex; justify-content: center; flex-shrink: 0; }
.handle-bar { width: 36px; height: 4px; background: var(--line-2); border-radius: 2px; }

/* ── Empty states ── */
.empty-state { text-align: center; padding: 60px 24px; color: var(--fg-3); font-size: 13px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  #app { position: fixed; inset: 0; flex-direction: column; }
  #sidebar { display: none; }
  #topbar { display: none; }
  #mobile-header { display: flex; }
  #mobile-tabbar { display: flex; }
  #main { position: relative; }

  .run-drawer-panel {
    position: absolute; top: 24px; right: 0; bottom: 0; left: 0;
    width: auto; border-left: none;
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
  }
  .agent-sheet-panel {
    position: absolute; top: 24px; right: 0; bottom: 0; left: 0;
    width: auto; border-left: none;
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
  }
  .digest-list { padding: 10px 14px 24px; }
  .digest-card-body { padding: 12px 16px 14px; }
  .digest-bullet { font-size: 13.5px; }
  .digest-card-hdr { flex-wrap: wrap; }
  .digest-card-title { white-space: normal; flex-basis: 0; flex-grow: 1; min-width: 120px; }
}
.new-dropdown { position: relative; display: inline-flex; }
.new-dropdown-menu {
  display: none; position: absolute; top: calc(100% + 6px); right: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 16px oklch(0 0 0 / .15); z-index: 200; min-width: 150px; overflow: hidden;
}
.new-dropdown.open .new-dropdown-menu { display: block; }
.new-dropdown-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 13px;
  color: var(--fg); cursor: pointer; border: none; background: none; width: 100%; text-align: left;
}
.new-dropdown-item:hover { background: var(--hover); }
.new-dropdown-item + .new-dropdown-item { border-top: 1px solid var(--line); }
.sheet-subtitle { margin: 3px 0 0; font-size: 12px; color: var(--fg-3); }

/* ── Run metrics: status + chart colors ── */
/* Status steps are fixed (never themed); phase colors are categorical slots 1-6, validated
   for both surfaces (light slots 3-5 are under 3:1, so every chart has a legend + tooltip + table). */
body {
  --st-good: #0ca30c; --st-warn: #fab219; --st-crit: #d03b3b; --st-none: var(--fg-4);
  --ph-1: #3987e5; --ph-2: #d95926; --ph-3: #199e70; --ph-4: #c98500; --ph-5: #d55181; --ph-6: #008300;
  --grid: oklch(0.27 0.006 260); --axis: oklch(0.36 0.008 260);
}
body.theme-light {
  --ph-1: #2a78d6; --ph-2: #eb6834; --ph-3: #1baf7a; --ph-4: #eda100; --ph-5: #e87ba4; --ph-6: #008300;
  --grid: #e1e0d9; --axis: #c3c2b7;
}
.mchip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg-3); color: var(--fg-2);
  font-family: var(--font-mono); font-size: 10.5px; white-space: nowrap; line-height: 1.4;
}
button.mchip { cursor: pointer; }
button.mchip:hover { border-color: var(--line-2); color: var(--fg); }
.mchip .st-ic { width: 7px; height: 7px; border-radius: 50%; background: var(--st-c); flex-shrink: 0; }
.mchip.t-good { --st-c: var(--st-good); }
.mchip.t-warn { --st-c: var(--st-warn); border-color: color-mix(in oklab, var(--st-warn) 45%, var(--line)); }
.mchip.t-crit { --st-c: var(--st-crit); border-color: color-mix(in oklab, var(--st-crit) 45%, var(--line)); }
.mchip.t-none { --st-c: var(--st-none); }
.mchip.open { background: var(--panel-2); color: var(--fg); }

/* Stats panel (run card) */
.stats { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 18px; overflow: hidden; }
.stats-sec { padding: 12px 14px; border-top: 1px solid var(--line); overflow-x: auto; }
.stats-sec:first-child { border-top: none; }
.stats-h { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.stats-h .note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg-4); margin-left: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.tile-l { font-size: 10.5px; color: var(--fg-3); }
.tile-v { font-size: 15px; font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-s { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; line-height: 1.35; }
.mt { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.mt th { text-align: left; font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mt td { padding: 4px 6px; border-bottom: 1px solid var(--grid); color: var(--fg-2); vertical-align: top; }
.mt th.r, .mt td.r { text-align: right; }
.mt td.url { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 10.5px; }
.mt tr:last-child td { border-bottom: none; }
.mt .err { color: var(--danger); }
.flag { display: inline-block; font-family: var(--font-mono); font-size: 9.5px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--fg-2); margin-left: 3px; }
.flag.bad { border-color: color-mix(in oklab, var(--st-crit) 55%, var(--line)); color: var(--fg); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 11.5px; }
.kv dt { color: var(--fg-3); }
.kv dd { color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; word-break: break-word; }
.sec-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.sec-tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg-2); }
.sec-tag::before { content: "✓ "; color: var(--st-good); }
.sec-tag.miss::before { content: "✕ "; color: var(--st-crit); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--fg-2); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tl-lane { position: relative; height: 16px; margin: 3px 0; background: var(--bg-3); border-radius: 3px; }
.tl-lane-l { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px; }
.tl-seg { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; min-width: 2px; }
.tl-seg:hover, .tl-seg:focus { outline: 2px solid var(--fg); outline-offset: 0; z-index: 1; }
.pl-pre { white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; max-height: 360px; overflow: auto; margin-top: 6px; }
details.ev summary { cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); padding: 2px 0; list-style: none; display: flex; gap: 8px; }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary .k { color: var(--fg-3); width: 92px; flex-shrink: 0; }
details.ev summary .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkbtn { background: none; border: none; padding: 0; color: var(--link); cursor: pointer; font: inherit; font-size: 11px; }

/* Dashboard */
.dash { padding: 18px 24px 80px; max-width: 1180px; }
.dash-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card-h { font-size: 13px; font-weight: 600; }
.card-s { font-size: 11.5px; color: var(--fg-3); margin: 2px 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi-v { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
.kpi-s { font-size: 11.5px; color: var(--fg-3); margin-top: 2px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--fg-3); font-family: var(--font-mono); font-size: 10px; }
.chart .hit { cursor: pointer; }
.chart .hit:hover .mk, .chart .hit:focus .mk { stroke: var(--fg); stroke-width: 2; }
.wgrid { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 11.5px; table-layout: fixed; }
.wgrid th { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; color: var(--fg-3); text-align: center; padding: 2px; white-space: nowrap; }
.wgrid th.rl { text-align: left; width: 34%; }
.wgrid td.rl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); padding-right: 6px; }
.wgrid td.c { background: var(--bg-3); border-radius: 3px; height: 22px; text-align: center; padding: 2px; }
.wgrid .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 1px; border: none; padding: 0; cursor: pointer; background: var(--st-c); vertical-align: middle; }
.wgrid .dot:hover, .wgrid .dot:focus { outline: 2px solid var(--fg); outline-offset: 1px; }
.dot.t-good { --st-c: var(--st-good); } .dot.t-warn { --st-c: var(--st-warn); } .dot.t-crit { --st-c: var(--st-crit); } .dot.t-none { --st-c: var(--st-none); }
.bars-h { display: flex; flex-direction: column; gap: 5px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; }
.bar-row .l { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .t { height: 10px; background: var(--bg-3); border-radius: 0 4px 4px 0; }
.bar-row .f { height: 100%; background: var(--ph-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .v { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
#viz-tip {
  position: fixed; z-index: 300; pointer-events: none; display: none; max-width: 300px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow);
  padding: 7px 9px; font-size: 11.5px; color: var(--fg-2); line-height: 1.45;
}
#viz-tip b { color: var(--fg); font-weight: 600; }

/* Active table: sort + filter */
.agents-table th.sort { cursor: pointer; user-select: none; }
.agents-table th.sort:hover { color: var(--fg); }
.agents-table th .arr { color: var(--fg-4); margin-left: 3px; }
.tbl-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tbl-bar .input { max-width: 280px; padding: 5px 9px; font-size: 12.5px; }
.spark-bar.t-good { background: var(--st-good); } .spark-bar.t-warn { background: var(--st-warn); }
.spark-bar.t-crit { background: var(--st-crit); } .spark-bar.t-none { background: var(--line-2); }

/* Sidebar: runs only, collapsible */
.sb-runs-hdr { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 12.5px; font-weight: 500; }
.sb-runs-hdr .cnt { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-4); }
#app.sb-collapsed #sidebar { display: none; }
#sb-open-btn { display: none; }
#app.sb-collapsed #sb-open-btn { display: inline-flex; }

@media (max-width: 640px) {
  .dash { padding: 10px 14px 24px; }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi-v { font-size: 20px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-name">dispatch</div>
      <button class="btn btn-ghost btn-sm" onclick="setSidebarCollapsed(true)" title="Hide runs sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><polyline points="16 10 14 12 16 14"/></svg>
      </button>
    </div>
    <div class="sb-runs-hdr" id="sb-runs-hdr"></div>
    <div class="filter-strip" id="filter-strip"></div>
    <div id="sb-list"></div>
    <div class="sb-footer">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="openAgentSheet(null)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New dispatch
      </button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main">
    <!-- Mobile header -->
    <div id="mobile-header">
      <div>
        <div class="mob-brand">dispatch</div>
        <h1 class="mob-title" id="mob-title">Digest<span class="cnt" id="mob-count"></span></h1>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="run-pill" id="run-pill-m" hidden onclick="openRunPill()"></button>
        <button class="btn btn-ghost btn-sm" onclick="openSettingsSheet()" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn-mobile" title="Toggle theme"></button>
        <div class="new-dropdown" id="new-dd-mobile">
          <button class="btn btn-sm" onclick="toggleNewMenu('new-dd-mobile',event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:2px"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="new-dropdown-menu">
            <button class="new-dropdown-item" onclick="openAgentSheet(null);closeNewMenus()">New dispatch</button>
            <button class="new-dropdown-item" onclick="openAgentConfigSheet(null);closeNewMenus()">New agent</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Topbar -->
    <div id="topbar">
      <div class="topbar-top">
        <div style="display:flex;gap:8px;align-items:flex-start">
          <button class="btn btn-ghost btn-sm" id="sb-open-btn" onclick="setSidebarCollapsed(false)" title="Show runs sidebar" style="margin-top:1px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><polyline points="14 10 16 12 14 14"/></svg>
          </button>
          <div>
          <h1 class="topbar-title">Agents</h1>
          <div class="topbar-meta" id="topbar-meta"></div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="run-pill" id="run-pill" hidden onclick="openRunPill()"></button>

// API key is entered once per browser and kept in localStorage (never embedded in the page).

function askForApiKey() {

// ── Dispatch helpers ──
function expandDow(p) {
  const out = new Set();
  if (p === '*') { for (let i = 0; i < 7; i++) out.add(i); return out; }
  for (const part of p.split(',')) {
    if (part.includes('-')) {
      const [a,b] = part.split('-').map(Number);
      for (let i = a; i <= b; i++) out.add(i);
    } else if (/^\d+$/.test(part)) {
      out.add(+part);
    } else {
      for (let i = 0; i < 7; i++) out.add(i);
    }
  }
  return out;
}

function formatTime12(h, m) {
  if (!/^\d+$/.test(String(h)) || !/^\d+$/.test(String(m))) return `${h}:${m}`;
  const hi = +h, mi = +m;
  const am = hi < 12;
  const h12 = ((hi + 11) % 12) + 1;
  return `${h12}:${String(mi).padStart(2,'0')} ${am ? 'AM' : 'PM'}`;
}

// Cron schedules are wall-clock time in the dispatch's timezone; new ones use the browser's.
const BROWSER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

function humanizeCron(expr, tz) {
  if (!expr) return expr;
  const parts = expr.trim().split(/\s+/);
  if (parts.length !== 5) return expr;
  const [m, h, dom, mon, dow] = parts;
  const time = formatTime12(h, m) + (tz && tz !== BROWSER_TZ ? ` (${tz})` : '');
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if (dom === '*' && mon === '*' && dow === '*') return `Daily at ${time}`;
  if (dom === '*' && mon === '*' && /^\d+$/.test(dow)) return `${DOW[+dow % 7]} at ${time}`;
  if (dom === '*' && mon === '*' && dow.includes(',')) {
    return dow.split(',').map(d => DOW[+d % 7]).join('/') + ` at ${time}`;
  }
  if (dom === '*' && mon === '*' && dow.includes('-')) {
    const [a,b] = dow.split('-').map(Number);
    return `${DOW[a % 7]}–${DOW[b % 7]} at ${time}`;
  }
  return expr;
}

// Older versions saved humanizeCron text as the label when none was given; it goes stale when the schedule changes.
function isAutoLabel(label) {
  return !!label && /^(Daily at|(Sun|Mon|Tue|Wed|Thu|Fri|Sat)s? at|(Sun|Mon|Tue|Wed|Thu|Fri|Sat)s?[\/–])/.test(label);
}

// Unlabeled dispatches: the prompt, else the agent's name (the schedule is shown next to it already).
function dispatchLabel(c, fallbackLen) {
  if (c.label && !isAutoLabel(c.label)) return c.label;
  if (!fallbackLen) return '';
  return (c.prompt && truncate(c.prompt, fallbackLen)) || allAgents.find(a => a.name === c.agent)?.label || c.agent;
}

function nextRun(expr, now, tz) {
  if (!expr) return null;
  if (tz && tz !== BROWSER_TZ) return null;
  now = now || new Date();
  const parts = expr.trim().split(/\s+/);
  if (parts.length !== 5) return null;
  const [mP, hP,,,dowP] = parts;
  const tgtM = +mP, tgtH = +hP;
  if (isNaN(tgtM) || isNaN(tgtH)) return null;
  const dows = expandDow(dowP);
  for (let i = 0; i < 14; i++) {
    const d = new Date(now);
    d.setSeconds(0,0);
    d.setDate(d.getDate() + i);
    d.setHours(tgtH, tgtM);
    if (i === 0 && d <= now) continue;
    if (dows.has(d.getDay())) return d;
  }
  return null;
}

function relTime(date, now) {
  if (!date) return '—';
  now = now || new Date();
  const ms = date - now;
  if (ms < 0) return 'overdue';
  const min = Math.round(ms / 60000);
  if (min < 60) return `in ${min}m`;
  const hr = Math.round(min / 60);
  if (hr < 24) return `in ${hr}h`;
  const day = Math.round(hr / 24);
  if (day === 1) return 'tomorrow';
  if (day < 7) return `in ${day}d`;
  return date.toLocaleDateString();
}

function shortDate(d) {
  if (!d) return '—';
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `${DOW[d.getDay()]} ${formatTime12(d.getHours(), d.getMinutes())}`;
}

function nextRunCellHTML(cron, tz) {
  const next = nextRun(cron, null, tz);
  return `<div style="display:flex;flex-direction:column;gap:2px">
    <span style="font-size:12.5px">${esc(humanizeCron(cron, tz))}</span>
    <span class="meta-mono" style="font-size:11px">${esc(shortDate(next))} · ${esc(relTime(next))}</span>

}

// ── Utilities ──
function headers() {
  const h = { 'Content-Type': 'application/json' };
  if (API_KEY) h['Authorization'] = `Bearer ${API_KEY}`;
  return h;
}

function esc(str) {
  if (str == null || str === false) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function fmtDuration(ms) {
  if (!ms || ms <= 0) return '';
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}m ${s}s`;
}

function fmtRelTime(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000)    return 'just now';
  if (diff < 3600000)  return `${Math.floor(diff / 60000)}min ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}hr ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function truncate(str, max) {
  return str && str.length > max ? str.slice(0, max) + '…' : str || '';
}

function shortArg(argsJson) {
  try { const a = JSON.parse(argsJson); return a.query || a.url || ''; } catch { return ''; }
}

  const iconClock = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 13 16 15"/></svg>`;
  const nActive = activeJobs.size;
  document.getElementById('sb-runs-hdr').innerHTML = `${iconClock} Runs <span class="cnt">${allSessions.length}</span>` +
    (nActive ? ` <i class="run-dot" title="${nActive} active"></i>` : '');
}

function renderSidebar() {
  initFilterStrip();
  updateModeBtns();
  renderSidebarList();
}

function renderSidebarList() {
  const list = document.getElementById('sb-list');
  let items = [...allSessions];
  if (activeFilter !== 'all') items = items.filter(s => s.agent === activeFilter);
  if (!items.length) { list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--fg-3);font-size:12px">No runs yet</div>`; return; }
  list.innerHTML = items.map(s => {
    const isActive = runDrawerSessionId === s.id;
    const runBadge = `<span class="run-status" data-session="${s.id}">${runStatusHTML(s.id)}</span>`;
    return `<button class="sb-item${isActive ? ' active' : ''}${!s.viewed ? ' unread' : ''}" onclick="openRunDrawer(${s.id})">
      <div class="sb-item-row">${pillHTML(s.agent)} ${runBadge} ${jobForSession(s.id) ? '' : `<span class="meta-mono" style="margin-left:auto;font-size:10.5px">${esc(fmtTime(s.started_at))}</span>`}</div>
      <div class="sb-item-prompt">${esc(s.prompt || '—')}</div>
      ${!jobForSession(s.id) && s.run_status ? `<div style="margin-top:5px">${metricsChipHTML(s.run_status, s.run_sources, s.run_ms, { backfill: s.metrics_source === 'backfill' })}</div>` : ''}
    </button>`;
  }).join('');
}

// ── Topbar ──
function updateTopbar() {
  const active = allDispatches.filter(c => c.enabled);
  const archived = allDispatches.filter(c => !c.enabled);
  const soonest = active.map(c => nextRun(c.schedule, null, c.timezone)).filter(Boolean).sort((a, b) => a - b)[0];
  const nr = soonest ? relTime(soonest) : '';
  document.getElementById('topbar-meta').textContent =
    `${active.length} active${nr ? ' · next run ' + nr : ''}`;
  document.getElementById('tc-digest').textContent = digestItems.length || '';
  document.getElementById('tc-active').textContent = active.length || '';
  document.getElementById('tc-archived').textContent = archived.length || '';
  document.getElementById('tc-library').textContent = allAgents.length || '';
}

function setTab(tab) {
  dispatchTab = tab;
  ['digest','active','archived','dashboard','library'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  renderContent();
}

// ── Mobile tab ──
function setMobileTab(tab) {
  mobileTab = tab;
  ['digest','agents','runs','stats'].forEach(t => {
    document.getElementById('mtab-' + t).classList.toggle('active', t === tab);
  });
  const titles = { digest: 'Digest', agents: 'Agents', runs: 'Runs', stats: 'Stats' };
  document.getElementById('mob-title').childNodes[0].textContent = titles[tab];
  const counts = {
    digest: digestItems.length,
    agents: allDispatches.filter(c => c.enabled).length,
    runs: allSessions.length
  };
  document.getElementById('mob-count').textContent = counts[tab] || '';
  renderMobileContent();
}

// ── Content rendering ──
function isMobile() { return window.innerWidth <= 640; }

function renderDispatch() {
  if (isMobile()) renderMobileContent();
  else renderContent();
}

function renderContent() {
  if (dispatchTab === 'digest') renderDigest();
  else if (dispatchTab === 'active') renderDispatchesTable(allDispatches.filter(c => c.enabled), 'active');
  else if (dispatchTab === 'archived') renderDispatchesTable(allDispatches.filter(c => !c.enabled), 'archived');
  else if (dispatchTab === 'dashboard') renderDashboard();
  else renderAgentLibrary();
}

function renderMobileContent() {
  if (mobileTab === 'digest') renderDigest();
  else if (mobileTab === 'agents') renderMobileAgents();
  else if (mobileTab === 'stats') renderDashboard();
  else renderMobileRuns();
}

// ── Digest ──
function renderDigest() {
  const el = document.getElementById('content');
  if (!digestItems.length) {
    el.innerHTML = `<div class="empty-state">No active agents with recent runs.</div>`;
    return;
  }
  const sorted = [...digestItems].sort((a,b) => {
    const ta = a.session ? new Date(a.session.started_at).getTime() : 0;
    const tb = b.session ? new Date(b.session.started_at).getTime() : 0;
    return tb - ta;
  });
  sorted.forEach(({ dispatch: c }) => {
    const id = `dc-${c.id}`;
    if (!digestSeenCards.has(id)) {
      digestSeenCards.add(id);
      digestOpenCards.add(id);
    }
  });
  const allCollapsed = digestOpenCards.size === 0;
  const chevR = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>`;
  const toggleBtn = `<button class="btn btn-ghost btn-sm" onclick="digestToggleAll()" id="digest-toggle-btn">${allCollapsed ? 'Expand all' : 'Collapse all'}</button>`;
  let cards = sorted.map(({ dispatch: c, session: s }) => {
    const id = `dc-${c.id}`;
    const isOpen = digestOpenCards.has(id);
    const label = dispatchLabel(c, 60);
    const runs = c.max_runs ? `${c.run_count}/${c.max_runs}` : `${c.run_count}`;
    const when = s ? fmtRelTime(s.started_at) : '';

    let body = '';
    if (!s) {
      body = `<div style="padding:12px 22px;font-size:13px;color:var(--fg-3);font-style:italic">No runs yet.</div>`;
    } else if (!s.content) {
      body = `<div style="padding:12px 22px;font-size:13px;color:var(--fg-3);font-style:italic">No output recorded.</div>`;
    } else {
      body = `<div style="padding:16px 22px 22px"><div class="md" style="font-size:14px;line-height:1.6;color:var(--fg-2)">${marked.parse(s.content)}</div></div>`;
    }

    const sessionOnclick = s ? `openRunDrawer(${s.id})` : `openAgentSheet(${c.id})`;

    return `<article class="digest-card" id="${id}">
      <div class="digest-card-hdr${isOpen ? ' open' : ''}" onclick="digestToggleCard('${id}', event)" data-session="${s?.id || ''}" data-dispatch="${c.id}">
        ${pillHTML(c.agent)}
        <h2 class="digest-card-title">${esc(label)}</h2>
        <span class="meta-mono">${runs} runs</span>
        ${when ? `<span class="meta-mono">·</span><span class="meta-mono">${esc(when)}</span>` : ''}
        <button class="btn btn-ghost btn-sm" style="margin-left:4px" onclick="event.stopPropagation();digestToggleCard('${id}', event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${isOpen?90:0}deg);transition:transform 0.15s"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
      </div>
      ${isOpen ? `<div class="digest-card-content">${body}</div>` : ''}
    </article>`;
  }).join('');

  el.innerHTML = `<div class="digest-list">
    <div style="display:flex;align-items:center;margin-bottom:12px;gap:8px">
      <span class="meta-mono" style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em">${digestItems.length} item${digestItems.length !== 1 ? 's' : ''} · today</span>
      ${toggleBtn}
    </div>
    ${cards}
  </div>`;
}

function digestToggleAll() {
  const allCollapsed = digestOpenCards.size === 0;
  if (allCollapsed) {
    digestItems.forEach(({ dispatch: c }) => digestOpenCards.add(`dc-${c.id}`));
  } else {
    digestOpenCards.clear();
  }
  renderDispatch();
}

function digestToggleCard(id, event) {
  event.stopPropagation();
  if (digestOpenCards.has(id)) {
    digestOpenCards.delete(id);
  } else {
    digestOpenCards.add(id);
  }
  renderDispatch();
}
